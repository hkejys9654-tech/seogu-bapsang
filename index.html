<style>
:root{
  --bg:#f6f7f9;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;
  --orange:#ff7a21;--soft:#fff2e8;--green:#16a34a;--amber:#f59e0b;--red:#ef4444;
  --purple:#6d28d9;--shadow:0 10px 30px rgba(15,23,42,.08)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(#f6f7f9,#eceef2);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text)}
.app{max-width:430px;min-height:100vh;margin:0 auto;background:var(--bg)}
.top{position:sticky;top:0;z-index:10;background:rgba(246,247,249,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:18px 18px 10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:14px;border:0;background:linear-gradient(135deg,#ff944d,#ff6a00);color:#fff;font-weight:900;display:grid;place-items:center;box-shadow:var(--shadow);cursor:pointer}
.brand h1{font-size:20px;margin:0;line-height:1.1}.brand h1 span{color:var(--orange)}
.sub{font-size:13px;color:var(--muted);line-height:1.45}.tiny{font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--orange);border:1px solid #ffd9bf;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900;white-space:nowrap}
.badge.live{background:#ecfdf5;border-color:#a7f3d0;color:#047857}.badge.demo{background:#fef3c7;border-color:#fde68a;color:#92400e}
.content{padding:16px 16px 100px}
.booking-hours{margin:0 0 14px;padding:14px 18px;border:2px solid #fb923c;border-radius:18px;background:#fff2e8;text-align:center;color:#9a3412}
.booking-hours span{display:block;font-size:15px;font-weight:800;margin-bottom:4px}
.booking-hours strong{display:block;font-size:30px;font-weight:950;line-height:1.2;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.card{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.title{font-size:18px;font-weight:900;margin:0 0 10px}
.btn{border:0;border-radius:16px;padding:14px 16px;font-size:15px;font-weight:900;cursor:pointer;transition:.15s ease}
.btn:active{transform:scale(.98)}.btn.primary{background:linear-gradient(135deg,#ff8b3d,#ff6a00);color:#fff;box-shadow:0 10px 20px rgba(255,106,0,.22)}
.btn.light{background:#fff;border:1px solid var(--line);color:var(--text)}.btn.soft{background:var(--soft);color:var(--orange);border:1px solid #ffd9bf}
.btn.green{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}.btn.danger{background:#fff1f2;color:#e11d48;border:1px solid #fecdd3}
.btn.small{padding:10px 12px;font-size:13px;border-radius:12px}.btn.full{width:100%}.btnrow{display:flex;gap:10px;margin-top:14px}
.hero{display:flex;gap:14px;align-items:flex-start}.platewrap{width:102px;flex:0 0 102px;height:102px;border-radius:26px;background:linear-gradient(#fff8e8,#f7eed1);border:1px solid #f0e2b7;display:grid;place-items:center}
.meal-name{font-size:18px;font-weight:900;margin:8px 0 6px}.menu-list{padding-left:18px;margin:0;font-size:14px;color:#374151;line-height:1.5}
.bar{height:11px;border-radius:999px;background:#eceff3;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#ff9b55,#ff6a00)}
.line{height:1px;background:var(--line);margin:14px 0}.detail{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f1f5f9;font-size:14px}.detail:last-child{border-bottom:0}.detail b{text-align:right}
.mini-card{padding:14px;border-radius:18px;background:#fff;border:1px solid var(--line)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:25;width:min(430px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.nav button{border:0;background:transparent;border-radius:16px;padding:8px 4px;color:#6b7280;font-weight:800;cursor:pointer}.nav button.active{background:var(--soft);color:var(--orange)}.nav b{display:block;font-size:20px}
.datebar{display:flex;gap:8px;margin:12px 0}.datebar .center{flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px;text-align:center;font-weight:900;cursor:pointer}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.quick button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px;font-weight:900;cursor:pointer}.quick button.active{border-color:#ffd9bf;background:var(--soft);color:var(--orange)}
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.slot{border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px 12px;text-align:left;cursor:pointer}.slot.mine{border-color:#ffb77f;background:var(--soft);box-shadow:0 8px 18px rgba(255,122,33,.11)}.slot.eligible-later{border-color:#bfdbfe;background:#f8fbff}.slot.active{border:2px solid var(--orange);background:#fff7ed;box-shadow:0 10px 22px rgba(255,122,33,.16)}.slot.disabled{opacity:.48;pointer-events:none}.slot-orgs{font-size:11px;color:#64748b;line-height:1.4;margin-top:6px}.slot.mine .slot-orgs{color:#c2410c;font-weight:800}.assignment-card{margin:14px 0;padding:14px;border-radius:18px;background:linear-gradient(135deg,#fff7ed,#fff);border:1px solid #fed7aa}.assignment-time{font-size:25px;font-weight:950;color:#ea580c;margin-top:4px}.assignment-org{font-size:13px;color:#7c2d12;font-weight:800;margin-top:3px}
.time{font-size:18px;font-weight:900}.meta{font-size:12px;color:var(--muted)}.status{font-size:12px;font-weight:900;margin-top:8px}.good{color:var(--green)}.mid{color:var(--amber)}.bad{color:var(--red)}.gray{color:#6b7280}
#qrBox{display:flex;justify-content:center;align-items:center;margin:12px auto;padding:14px;width:172px;min-height:172px;background:#fff;border-radius:22px;border:1px solid #ffe1c9}.code{padding:14px;border-radius:18px;background:#fff;border:1px dashed #f7b787;font-weight:900;font-size:14px;text-align:center;word-break:break-all}
.entry-ticket{position:relative;overflow:hidden;margin-top:14px;padding:18px;border-radius:24px;background:linear-gradient(145deg,var(--ticket-soft),#fff);border:2px solid var(--ticket-accent);text-align:center;box-shadow:0 14px 30px color-mix(in srgb,var(--ticket-accent) 18%,transparent);transition:.25s ease}
.entry-ticket::after{content:"";position:absolute;right:-35px;bottom:-45px;width:130px;height:130px;border-radius:999px;background:var(--ticket-accent);opacity:.07}.ticket-live{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--ticket-ink);font-size:11px;font-weight:900}.ticket-live b{font-variant-numeric:tabular-nums}.ticket-live-dot{width:8px;height:8px;border-radius:999px;background:var(--ticket-accent);box-shadow:0 0 0 0 var(--ticket-accent);animation:ticketPulse 1.5s infinite}.ticket-label{position:relative;z-index:1;margin-top:15px;color:var(--ticket-ink);font-size:14px;font-weight:900;letter-spacing:.08em}.ticket-time{position:relative;z-index:1;color:var(--ticket-accent);font-size:58px;line-height:1;font-weight:950;letter-spacing:-.06em;margin:6px 0}.ticket-status{position:relative;z-index:1;display:inline-flex;padding:7px 14px;border-radius:999px;background:var(--ticket-accent);color:#fff;font-size:14px;font-weight:950}.ticket-owner{position:relative;z-index:1;margin-top:14px;font-size:14px;font-weight:950;color:#1f2937}.ticket-date{position:relative;z-index:1;margin-top:4px;font-size:12px;color:#64748b}.qr-help{text-align:center;font-size:12px;color:#6b7280;font-weight:800;margin-top:16px}.qr-caption{text-align:center;font-size:11px;color:#94a3b8;margin:-3px 0 12px}@keyframes ticketPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ticket-accent) 45%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.ticket-call{position:relative;z-index:1;margin:14px -8px 4px;padding:18px 10px;border-radius:18px;background:var(--ticket-accent);color:#fff;font-size:25px;font-weight:950;letter-spacing:-.04em}.ticket-queue{position:relative;z-index:1;margin-top:10px;color:var(--ticket-ink);font-size:15px;font-weight:950}.ticket-token{position:relative;z-index:1;margin-top:10px;padding:10px 12px;border:2px dashed var(--ticket-accent);border-radius:14px;color:var(--ticket-ink);font-size:18px;font-weight:950;background:rgba(255,255,255,.72)}
.pill{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:900;white-space:nowrap}.reserve{background:#fff7ed;color:#ea580c}.checkin{background:#ecfdf5;color:#047857}.cancel{background:#fef2f2;color:#dc2626}
.notice-card{background:linear-gradient(#fff,#faf8ff);border:1px solid #ebe5ff}.notice-item{padding:12px 0;border-bottom:1px solid #f0edf9}.notice-item:last-child{border-bottom:0;padding-bottom:0}.notice-tag{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:900;background:#f3f0ff;color:var(--purple);margin-bottom:6px}.notice-text{font-size:14px;color:#374151;line-height:1.45}
.notice{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:16px;padding:12px;font-size:13px;margin-top:14px;line-height:1.5}
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.44);display:none;align-items:flex-end;justify-content:center;z-index:80;padding:18px}.overlay.show{display:flex}.sheet{width:min(430px,100%);background:#fff;border-radius:28px 28px 18px 18px;box-shadow:0 25px 60px rgba(0,0,0,.25);max-height:92vh;overflow:auto}.sheethead{padding:16px 18px;border-bottom:1px solid var(--line)}.sheetbody{padding:18px}.form{display:flex;flex-direction:column;gap:12px}.input,.select,.file,textarea{width:100%;border:1px solid var(--line);border-radius:16px;padding:14px;font-size:15px;background:#fff;outline:none;font-family:inherit}textarea{min-height:120px;resize:vertical}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(30px);bottom:96px;z-index:60;background:#111827;color:#fff;padding:12px 16px;border-radius:14px;font-size:13px;font-weight:900;opacity:0;transition:.25s;max-width:calc(100% - 40px)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.admin-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}.admin-tabs button{border:1px solid var(--line);background:#fff;padding:10px 4px;border-radius:12px;font-size:11px;font-weight:900;cursor:pointer}.admin-tabs button.active{background:var(--soft);border-color:#ffd9bf;color:var(--orange)}
.cameraBox{overflow:hidden;border-radius:18px;border:1px solid var(--line);background:#000;aspect-ratio:3/4;display:grid;place-items:center}.cameraBox video{width:100%;height:100%;object-fit:cover}.scanResult{margin-top:10px;padding:12px;border-radius:14px;background:#f8fafc;border:1px solid #e2e8f0;font-size:13px;line-height:1.45}.reservation-item{border:1px solid var(--line);border-radius:18px;padding:12px;background:#fff;margin-bottom:10px}
.call-slot-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:12px 0}.call-slot-grid button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 2px;font-size:12px;font-weight:900;cursor:pointer}.call-slot-grid button.active{background:#123a6b;border-color:#123a6b;color:#fff}.call-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.call-stat{padding:12px 6px;border-radius:14px;text-align:center;border:1px solid var(--line);background:#fff}.call-stat b{display:block;font-size:24px;margin-bottom:3px}.call-stat span{font-size:11px;color:var(--muted);font-weight:900}.call-stat.green{background:#ecfdf5;border-color:#86efac;color:#047857}.call-buttons{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);align-items:end;gap:8px;margin-top:12px}.call-buttons button{padding:16px 4px;font-size:16px}.call-size label{display:block;font-size:12px;font-weight:900;margin-bottom:6px}.call-size select{min-height:54px;font-size:16px;font-weight:900}.call-size-hint{margin-top:8px;color:#9a3412;font-size:12px;line-height:1.5}.call-live-board{margin:14px 0;padding:18px;border-radius:20px;background:#ecfdf5;border:2px solid #22c55e;text-align:center;color:#065f46}.call-live-board.wait{background:#f8fafc;border-color:#cbd5e1;color:#475569}.call-live-board .call-number{font-size:32px;font-weight:950;letter-spacing:-.04em}.call-live-board .call-token-big{margin-top:8px;font-size:21px;font-weight:950}.call-help{margin-top:12px;padding:12px;border-radius:14px;background:#f8fafc;color:#475569;font-size:12px;line-height:1.55}.push-card{margin-top:14px;padding:14px;border:1px solid #bfdbfe;border-radius:18px;background:linear-gradient(135deg,#eff6ff,#fff)}.push-state{display:inline-flex;margin-top:8px;padding:5px 9px;border-radius:999px;background:#e2e8f0;color:#475569;font-size:11px;font-weight:900}.push-state.on{background:#dcfce7;color:#166534}.requeue-box{margin-top:14px;padding:14px;border-radius:18px;background:#fff7ed;border:1px solid #fdba74;text-align:center}.requeue-box b{display:block;color:#9a3412;margin-bottom:5px}.slot-closed{background:#fef2f2!important;border-color:#fecaca!important;color:#991b1b!important}

.dashboard-card{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 92% 4%, rgba(255,122,33,.18), transparent 28%),
    linear-gradient(180deg,#ffffff 0%,#fffaf5 100%);
  border:1px solid #ffe2ca;
}
.dashboard-card::after{
  content:"";
  position:absolute;
  right:-34px;
  top:-34px;
  width:118px;
  height:118px;
  border-radius:999px;
  background:rgba(255,122,33,.08);
}
.reserve-status-card{background:#fff;border:1px solid #f1f5f9;border-radius:18px;padding:13px;margin-top:14px}
.notice-card{background:linear-gradient(180deg,#fff,#fbfaff);border:1px solid #ede7ff}


.calendar-pop{
  margin-top:10px;
  padding:12px;
  border-radius:18px;
  border:1px solid #e5e7eb;
  background:#fff;
}
.calendar-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:10px;
}
.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}
.calendar-weekday{
  text-align:center;
  font-size:11px;
  color:#6b7280;
  font-weight:900;
  padding:4px 0;
}
.calendar-day{
  border:1px solid #f1f5f9;
  background:#fff;
  border-radius:12px;
  padding:8px 0;
  font-size:13px;
  font-weight:900;
  cursor:pointer;
}
.calendar-day.muted{
  color:#cbd5e1;
  background:#f8fafc;
}
.calendar-day.active{
  color:#fff;
  border-color:#ff7a21;
  background:#ff7a21;
}
.noshow-warning{
  margin-top:14px;
  padding:13px;
  border-radius:16px;
  background:#fff1f2;
  border:1px solid #fecdd3;
  color:#9f1239;
  font-size:13px;
  line-height:1.5;
  font-weight:800;
}
.noshow-row{
  background:#fff7ed;
  border-color:#fed7aa;
}


.reserve-focus-card{
  position:relative;
  overflow:hidden;
  background:linear-gradient(180deg,#fff7ed 0%,#ffffff 100%);
  border:1.5px solid #fed7aa;
  box-shadow:0 16px 34px rgba(255,122,33,.14);
}
.reserve-focus-card::before{
  content:"";
  position:absolute;
  top:-46px;
  right:-46px;
  width:132px;
  height:132px;
  border-radius:999px;
  background:rgba(255,122,33,.13);
}
.reserve-focus-head{
  position:relative;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
}
.reserve-focus-title{
  font-size:21px;
  font-weight:950;
  letter-spacing:-.4px;
  margin:0 0 5px;
}
.reserve-focus-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:44px;
  height:44px;
  border-radius:16px;
  color:#fff;
  font-size:20px;
  background:linear-gradient(135deg,#ff8b3d,#ff6a00);
  box-shadow:0 10px 20px rgba(255,106,0,.24);
}
.reserve-info-grid{
  position:relative;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:14px;
}
.reserve-info-cell{
  padding:10px 8px;
  border-radius:14px;
  border:1px solid #ffedd5;
  background:rgba(255,255,255,.72);
  text-align:center;
}
.reserve-info-cell b{display:block;font-size:13px;margin-top:3px;color:#111827}
.reserve-info-cell span{font-size:11px;color:#9a3412;font-weight:900}
.booking-type{position:relative;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 14px;padding:5px;border-radius:18px;background:#fff;border:1px solid #fed7aa}
.booking-type button{border:0;border-radius:13px;padding:12px 8px;background:transparent;color:#78716c;font-size:14px;font-weight:950;cursor:pointer}
.booking-type button.active{background:linear-gradient(135deg,#ff8b3d,#ff6a00);color:#fff;box-shadow:0 8px 16px rgba(255,106,0,.2)}
.party-picker{position:relative;margin:0 0 14px;padding:14px;border-radius:18px;background:#fff;border:1px solid #fdba74}
.party-picker-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.party-stepper{display:flex;align-items:center;gap:10px}
.party-stepper button{width:38px;height:38px;border:1px solid #fed7aa;border-radius:12px;background:#fff7ed;color:#c2410c;font-size:21px;font-weight:950;cursor:pointer}
.party-count{min-width:52px;text-align:center;color:#ea580c;font-size:25px;font-weight:950;font-variant-numeric:tabular-nums}
.party-note{margin-top:9px;color:#7c2d12;font-size:12px;font-weight:800;line-height:1.5}
.party-badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:#ede9fe;color:#6d28d9;font-size:11px;font-weight:950;white-space:nowrap}
.reserve-guide-text{
  position:relative;
  font-size:13px;
  color:#9a3412;
  font-weight:800;
  margin-bottom:12px;
  line-height:1.45;
}
/* 간결한 예약 화면 */
.hello{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 2px 12px}
.hello-name{font-size:21px;font-weight:950;letter-spacing:-.4px}
.hello-slot{flex:0 0 auto;text-align:center;padding:8px 12px;border-radius:16px;background:var(--soft);border:1px solid #ffd9bf}
.hello-slot span{display:block;font-size:11px;font-weight:900;color:#c2410c}.hello-slot b{font-size:18px;color:var(--orange);font-variant-numeric:tabular-nums}
.notice-strip{display:flex;align-items:center;gap:8px;width:100%;margin:0 0 12px;padding:10px 12px;border-radius:14px;border:1px solid #ede7ff;background:#fbfaff;text-align:left;cursor:pointer;font:inherit;color:var(--text)}
.notice-strip .notice-tag{margin:0;flex:0 0 auto}.ns-title{flex:1;min-width:0;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book-card{padding:18px 16px 16px}
.step{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:950;margin:4px 0 10px}
.step:not(:first-child){margin-top:18px}
.step-no{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:999px;background:var(--orange);color:#fff;font-size:13px}
.step-help{margin:-4px 0 10px}
.book-card .booking-type{margin-bottom:10px}
.party-inline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:16px;background:#fff7ed;border:1px solid #fed7aa;font-size:13px;font-weight:900;color:#9a3412}
.slot-list{display:flex;flex-direction:column;gap:8px}

// Admin-only, one-time legacy ledger backfill. Every reservation mutation must
// atomically touch its slotCounts document, so it also invalidates this guard.
async function ensureQueueLedger(date,time){
  const allowed=()=>firebaseOn&&db&&isAdminData()&&st.date===date;
  if(!allowed())return {complete:false,reason:"not-admin-context"};
  const ref=db.collection("slotCounts").doc(slotId(date,time));
  const baseline=await ref.get({source:"server"});
  const baselineData=baseline.exists?baseline.data():null;
  if(baselineData&&baselineData.queueLedgerVersion===1)return {complete:true,reason:"already-ready"};
  if(!allowed())return {complete:false,reason:"context-changed"};
  // Read after the baseline, never use a potentially older cached UI snapshot.
  const found=await db.collection("reservations").where("date","==",date).where("time","==",time).get({source:"server"});
  if(!allowed())return {complete:false,reason:"context-changed"};
  return db.runTransaction(async tx=>{
    if(!allowed())return {complete:false,reason:"context-changed"};
    const current=await tx.get(ref),data=current.exists?current.data():null;
    if(data&&data.queueLedgerVersion===1)return {complete:true,reason:"already-ready"};
    if(JSON.stringify(data)!==JSON.stringify(baselineData))throw new Error("QUEUE_LEDGER_CHANGED");
    // Re-read all known documents inside the transaction. Concurrent edits retry
    // the transaction; inserts/requeues change the slot guard and abort safely.
    const snapshots=await Promise.all(found.docs.map(doc=>tx.get(doc.ref)));
    const entries={};
    for(const snap of snapshots){
      if(!snap.exists)continue;
      const r=snap.data();
      if(r.date!==date||r.time!==time||r.qrEligible===false||!['reserved','checkedin'].includes(r.status))continue;
      const number=Number(r.queueNumber);
      if(!Number.isSafeInteger(number)||number<1||Object.prototype.hasOwnProperty.call(entries,String(number)))return {complete:false,reason:"invalid-queue-number"};
      entries[String(number)]={size:partySizeOf(r),waiting:r.status==="reserved"&&r.callStatus!=="called"&&r.callStatus!=="passed"};
    }
    if(!allowed())return {complete:false,reason:"context-changed"};
    const update={queueEntries:entries,queueLedgerVersion:1,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
    // update replaces the map, unlike set(...,{merge:true}), which could retain
    // obsolete nested queue entries. A guard conflict never overwrites new data.
    if(current.exists)tx.update(ref,update);
    else tx.set(ref,{date,time,...update});
    return {complete:true,reason:"backfilled"};
  });
}

async function connectCallNotifications(requestPermission){

        if(!response.ok)throw new Error("PUSH_REGISTER_FAILED");

      }finally{clearTimeout(timer)}

      pushConnection={mode:"push",emp:user.emp,reason:""};

    }

}

function koreaClock(now=new Date()){
  const parts=Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(now).map(p=>[p.type,p.value]));
  return {date:`${parts.year}-${parts.month}-${parts.day}`,minutes:Number(parts.hour)*60+Number(parts.minute)};
}

function reservationWindowMessage(now=new Date()){return reservationWindowState(now)==="before"?"오전 10:00에 예약이 열립니다":reservationWindowState(now)==="closed"?"오늘 예약이 마감되었습니다 · 11:00 마감":"예약 접수 중 · 11:00 마감";}
function slotEndTime(time){const [h,m]=time.split(":").map(Number),end=h*60+m+SLOT_MINUTES;return `${String(Math.floor(end/60)).padStart(2,"0")}:${String(end%60).padStart(2,"0")}`;}
function reservationTimePassed(r,now=new Date()){
  const clock=koreaClock(now);if(!r||r.date!==clock.date||slotIndex(r.time)<0)return false;
  const [h,m]=slotEndTime(r.time).split(":").map(Number);return clock.minutes>=h*60+m;
}

function queueLedgerPatch(data,before,after){
  data=data||{};
  const queueEntries={...(data.queueEntries||{})};
  const number=r=>r&&Number.isInteger(Number(r.queueNumber))&&Number(r.queueNumber)>0?String(Number(r.queueNumber)):"";
  const oldNumber=number(before),newNumber=number(after);
  if(oldNumber)queueEntries[oldNumber]={size:0,waiting:false};
  if(newNumber&&after.status==="reserved"&&after.qrEligible!==false){
    queueEntries[newNumber]={size:partySizeOf(after),waiting:after.callStatus!=="called"&&after.callStatus!=="passed"};
  }
  const r=after||before||{},patch={date:r.date||data.date,time:r.time||data.time,queueEntries};
  // Partial legacy ledgers must stay unknown until an administrator rebuilds them.
  if(data.queueLedgerVersion===1||(Number(data.count||0)===0&&!Number(data.nextQueueNumber||0)))patch.queueLedgerVersion=1;
  return patch;
}

async function reserveFirebase(booking=null){
  if(reserveFirebase.pending)return toast("예약 처리 중입니다. 잠시 기다려주세요.");
  if(!reservationWindowOpen())return toast(reservationWindowMessage());
  if(!booking){
    if(!st.user)return toast("직원 정보를 먼저 등록해주세요.");
    const bookingDate=todayDate(),user={...st.user},time=st.slot,org=userOrganization();
    booking={bookingDate,user,time,org:org&&{...org},assigned:org?assignedSlot(org.key,bookingDate):"",partySize:selectedPartySize(),overflow:org?isOverflowChoice(time,bookingDate,org):false,late:false};
  }
  const {bookingDate,user,time,org,assigned,partySize,overflow,late}=booking,members=booking.members||[],shareKey=partySize>1?newShareKey():"";
  const slot=SLOTS.find(s=>s[0]===time);

    if(data.emp!==user.emp||data.date!==bookingDate||data.status==="cancelled")return false;
    const item={...data,id:docId(bookingDate,user.emp)};
    st.reservations=st.reservations.filter(r=>r.id!==item.id);st.reservations.push(item);
    confirmedReservations.set(item.id,item);dataState.reservation="ready";reservationSnapshotReady=true;
    listenOwnQueue(item);go("my");toast(message);return true;
  };
  let existingReservation=null;
  reserveFirebase.pending=true;
  try{
    await db.runTransaction(async tx=>{
      if(bookingDate!==todayDate())throw new Error("DATE_CHANGED");
      if(!reservationWindowOpen())throw new Error("WINDOW_ENDED");
      const rSnap=await tx.get(rRef);
      if(rSnap.exists&&rSnap.data().status!=="cancelled"){existingReservation=rSnap;throw new Error("EXISTS");}
      const pSnap=await tx.get(db.collection("penalties").doc(user.emp));
      if(pSnap.exists&&pSnap.data().blockDate===bookingDate)throw new Error("BLOCKED");
      const ownCompanion=await tx.get(db.collection("companions").doc(docId(bookingDate,user.emp)));
      if(ownCompanion.exists)throw new Error("IS_COMPANION");
      for(const m of members){
        const mRes=await tx.get(db.collection("reservations").doc(docId(bookingDate,m.emp)));
        if(mRes.exists&&mRes.data().status!=="cancelled")throw new Error("MEMBER_BOOKED|"+m.name);
        const mComp=await tx.get(db.collection("companions").doc(docId(bookingDate,m.emp)));
        if(mComp.exists)throw new Error("MEMBER_TAKEN|"+m.name);
      }
      const controlSnap=await tx.get(db.collection("queueControls").doc(queueControlKey(bookingDate,time)));
      if(controlSnap.exists&&controlSnap.data().closed===true)throw new Error("CLOSED");
      const sSnap=!late?await tx.get(sRef):null,sData=sSnap&&sSnap.exists?sSnap.data():{};
      const count=Number(sData.count)||0,overflowCountNow=Number(sData.overflowCount)||0;
      const queueNumber=late?0:(Number(sData.nextQueueNumber)||count)+1;
      if(bookingDate!==todayDate())throw new Error("DATE_CHANGED");
      if(!reservationWindowOpen())throw new Error("WINDOW_ENDED");
      if(!late&&count+partySize>cap)throw new Error("FULL");
      if(!late&&overflow&&!overflowQuotaReleased()&&overflowCountNow+partySize>EARLY_OVERFLOW_QUOTA)throw new Error("OVERFLOW_FULL");
      const now=firebase.firestore.FieldValue.serverTimestamp();
      const item={name:user.name,orgKey:org.key,orgName:org.name,dept:user.dept,emp:user.emp,date:bookingDate,time,originalTime:time,assignedTime:assigned,isOverflow:overflow,queueNumber,requeueCount:0,callStatus:"waiting",reservationType:partySize>1?"group":"individual",partySize,meal:"점심식사",place:"본관 구내식당",loc:"서구청 본관 지하 1층",status:late?"late":"reserved",qrEligible:!late,code:late?"":code(bookingDate,time,user.emp),members,shareKey,createdAt:now,updatedAt:now};
      if(!late)tx.set(sRef,{...queueLedgerPatch(sData,null,item),cap,count:count+partySize,overflowCount:overflowCountNow+(overflow?partySize:0),nextQueueNumber:queueNumber,updatedAt:now},{merge:true});
      tx.set(rRef,item);
      for(const m of members)tx.set(db.collection("companions").doc(docId(bookingDate,m.emp)),{reservationId:docId(bookingDate,user.emp),ownerEmp:user.emp,ownerName:user.name,date:bookingDate,time,createdAt:now});
      if(shareKey)tx.set(db.collection("shares").doc(shareKey),{reservationId:docId(bookingDate,user.emp),date:bookingDate,createdAt:now});
    });
    st.members=[];st.memberResults=[];
    if(!inBookingScope())return;
    go("my");
    toast(late?lateReservationNotice():partySize>1?`${partySize}명 단체 예약이 완료되었습니다.`:"개인 예약이 완료되었습니다.");
  }catch(e){
    console.error(e);const msg=String(e.message||"");
    if(!inBookingScope())return;
    if(msg.includes("WINDOW_ENDED"))toast(reservationWindowMessage());
    else if(msg.includes("IS_COMPANION"))toast("이미 다른 직원의 단체 예약에 동행으로 포함돼 있어요. 입장표를 확인해주세요.");
    else if(msg.includes("MEMBER_BOOKED|"))toast(`${msg.split("|")[1]}님은 이미 오늘 예약이 있어요. 동행에서 빼고 다시 예약해주세요.`);
    else if(msg.includes("MEMBER_TAKEN|"))toast(`${msg.split("|")[1]}님은 이미 다른 단체에 포함돼 있어요. 동행에서 빼고 다시 예약해주세요.`);
    else if(msg.includes("EXISTS")){
      if(!existingReservation||!showConfirmedReservation(existingReservation,"이미 오늘 예약이 있습니다."))toast("오늘 예약을 입장표에서 다시 확인해주세요.");
    }
    else if(msg.includes("BLOCKED"))toast("노쇼 이력으로 오늘 예약이 제한됩니다.");
    else if(msg.includes("CLOSED")){toast("운영이 마감된 시간대입니다. 다른 시간을 선택해주세요.");void refreshOverview(true);}
    else if(msg.includes("DATE_CHANGED"))toast("날짜가 바뀌었습니다. 오늘 화면에서 다시 예약해주세요.");

}

// Shared by manual and QR entry; Firebase callers validate fresh data inside a transaction.
function checkinValidationMessage(r,qrText=null,penalty=null){
  if(!r)return "예약 정보를 찾지 못했습니다.";
  if(r.date!==todayDate())return "오늘 날짜의 예약만 입장 처리할 수 있습니다.";
  if(r.status==="checkedin")return `${r.name}님은 이미 입장 처리되었습니다.`;
  if(r.status==="cancelled")return `${r.name}님은 취소된 예약입니다.`;
  if(r.status==="noshow")return `${r.name}님은 노쇼 처리된 예약입니다. 관리자 확인이 필요합니다.`;
  // Manual entry retains the existing demo workflow for recorded late reservations.
  if(r.status!=="reserved"&&!isLateReservationStatus(r.status))return "입장 처리할 수 없는 예약 상태입니다.";
  if(qrText!==null){
    if(reservationTimePassed(r))return LATE_ARRIVAL_NOTICE;
    if(r.status!=="reserved"||r.qrEligible===false)return "QR 입장을 사용할 수 없는 예약입니다. 안내자에게 문의해주세요.";
    if(!r.code||r.code!==qrText)return "현재 예약의 QR 코드와 일치하지 않습니다.";
    if(r.callStatus!=="called")return r.callStatus==="passed"?`${r.name}님의 호출이 지났습니다. 안내자 확인이 필요합니다.`:`${r.name}님은 아직 입장 호출 전입니다.`;
  }
  if(penalty&&penalty.blockDate===r.date)return `${r.name}님은 노쇼 제한 대상입니다. 관리자 확인이 필요합니다.`;
  return "";
}
async function completeReservationCheckin(idv,qrText=null){
  if(firebaseOn){
    return db.runTransaction(async tx=>{
      const ref=db.collection("reservations").doc(idv),snap=await tx.get(ref);
      const r=snap.exists?snap.data():null;
      const invalid=checkinValidationMessage(r,qrText);
      if(invalid)return {error:invalid};
      const penaltySnap=await tx.get(db.collection("penalties").doc(r.emp));
      const blocked=checkinValidationMessage(r,qrText,penaltySnap.exists?penaltySnap.data():null);
      if(blocked)return {error:blocked};
      const sRef=r.status==="reserved"&&r.qrEligible!==false?db.collection("slotCounts").doc(slotId(r.date,r.time)):null;
      const sSnap=sRef?await tx.get(sRef):null,sData=sSnap&&sSnap.exists?sSnap.data():{};
      const now=firebase.firestore.FieldValue.serverTimestamp();
      tx.update(ref,{status:"checkedin",updatedAt:now});
      // Entry consumes the existing booking, so count remains unchanged.
      if(sRef)tx.set(sRef,{...queueLedgerPatch(sData,r,{...r,status:"checkedin"}),updatedAt:now},{merge:true});
      return {reservation:r};
    });
  }
  const r=st.reservations.find(x=>x.id===idv);
  const invalid=checkinValidationMessage(r,qrText,r&&st.penalties[r.emp]);
  if(invalid)return {error:invalid};
  r.status="checkedin";saveLocal();render();
  return {reservation:r};
}
async function checkin(idv){

}
async function checkinByCode(text){
  if(!text)return "QR 정보가 없습니다.";
  // Date and employee number locate the record; the full stored code must also match.
  const qrText=String(text),parts=qrText.split("|");
  if(parts.length!==4||parts[0]!=="SGMEAL"||!/^\d{4}-\d{2}-\d{2}$/.test(parts[1])||!/^\d{2}:\d{2}$/.test(parts[2])||!/^\d{4}$/.test(parts[3]))return "서구밥상 예약 QR 코드가 아닙니다.";
  try{
    const result=await completeReservationCheckin(docId(parts[1],parts[3]),qrText);
    if(result.error)return result.error;
    const r=result.reservation;
    return `${r.name}님 ${partySizeOf(r)}명 입장 처리 완료: ${r.time}`;
  }catch(e){console.error(e);return "입장 처리 중 오류가 발생했습니다. 연결 상태를 확인한 후 다시 시도해주세요."}
}

          tx.update(refs[index],changes);
        });
        tx.set(slotRef,{...ledgerPatch,updatedAt:now},{merge:true});
        tx.set(controlRef,{date,time,callRevision:expectedRevision+1,updatedAt:now},{merge:true});
      });
      toast("현재 호출을 종료했습니다.");
    }catch(e){console.error(e);toast(String(e.message).includes("CALL_CHANGED")?"예약이나 호출 상태가 바뀌었습니다. 최신 목록을 확인하고 다시 눌러주세요.":"호출 종료 중 오류가 발생했습니다.")}
    finally{callNext.pending=false}
    return;
  }
  active.forEach(item=>{const r=st.reservations.find(r=>r.id===item.id);if(r){r.callStatus="passed";r.passedAt=Date.now()}});saveLocal();render();toast("현재 호출을 종료했습니다.");
}
async function toggleQueueClosed(){
  const date=st.date,time=st.adminCallSlot;
  if(callNext.pending)return toast("입장 처리 중입니다. 잠시만 기다려주세요.");
  if(date!==todayDate())return toast("오늘 시간대만 운영 상태를 바꿀 수 있습니다.");
  const id=queueControlKey(date,time),wasClosed=isQueueClosed(date,time),closed=!wasClosed,item={date,time,closed,updatedAtMs:Date.now()},active=queueRows(date,time).filter(r=>r.status==="reserved"&&r.callStatus==="called").map(r=>({...r}));
  if(firebaseOn){
    const expectedRevision=Number((st.queueControls[id]||{}).callRevision||0),selected=closed?active:[];
    callNext.pending=true;
    try{
      await db.runTransaction(async tx=>{
        const controlRef=db.collection("queueControls").doc(id),slotRef=db.collection("slotCounts").doc(slotId(date,time));
        const refs=selected.map(r=>db.collection("reservations").doc(r.id));
        const snapshots=await Promise.all([tx.get(controlRef),tx.get(slotRef),...refs.map(ref=>tx.get(ref))]);
        const control=snapshots[0].exists?snapshots[0].data():{};
        if(date!==todayDate()||Boolean(control.closed)!==wasClosed||Number(control.callRevision||0)!==expectedRevision)throw new Error("CALL_CHANGED");
        const fresh=snapshots.slice(2).map((snap,index)=>{
          const r=snap.exists?snap.data():null;
          if(!r||r.date!==date||r.time!==time||r.status!=="reserved"||r.callStatus!=="called"||r.callBatchId!==selected[index].callBatchId)throw new Error("CALL_CHANGED");
          return r;
        });
        const now=firebase.firestore.FieldValue.serverTimestamp();
        let ledger=snapshots[1].exists?snapshots[1].data():{},ledgerPatch={};
        fresh.forEach((r,index)=>{
          const changes={callStatus:"passed",passedAt:now,updatedAt:now},patch=queueLedgerPatch(ledger,r,{...r,...changes});
          ledger={...ledger,...patch};ledgerPatch={...ledgerPatch,...patch};
          tx.update(refs[index],changes);
        });
        if(fresh.length)tx.set(slotRef,{...ledgerPatch,updatedAt:now},{merge:true});
        tx.set(controlRef,{...item,callRevision:expectedRevision+1,updatedAt:now},{merge:true});
      });
      toast(closed?`${time} 시간대를 마감했습니다.`:`${time} 시간대를 다시 열었습니다.`);
    }catch(e){console.error(e);toast(String(e.message).includes("CALL_CHANGED")?"예약이나 호출 상태가 바뀌었습니다. 최신 목록을 확인하고 다시 눌러주세요.":"시간대 운영상태 변경 중 오류가 발생했습니다.")}
    finally{callNext.pending=false}
    return;
  }
  if(closed)active.forEach(item=>{const r=st.reservations.find(r=>r.id===item.id);if(r){r.callStatus="passed";r.passedAt=Date.now()}});st.queueControls[id]=item;saveLocal();render();toast(closed?`${time} 시간대를 마감했습니다.`:`${time} 시간대를 다시 열었습니다.`);
}
async function addNotice(){
  if(uiNoticeSaving)return;
  const titleField=document.getElementById("noticeTitle"),bodyField=document.getElementById("noticeBody"),typeField=document.getElementById("noticeType");
  if(!titleField||!bodyField||!typeField)return;
  const type=typeField.value,title=titleField.value.trim(),body=bodyField.value.trim();
  if(!title||!body)return toast("제목과 내용을 입력해주세요.");
  const submitted={type,title:titleField.value,body:bodyField.value},item={type,title,body,createdAtMs:Date.now()};
  uiNoticeSaving=true;
  const button=titleField.closest(".form").querySelector("button");if(button)button.disabled=true;
  try{
    if(firebaseOn){await db.collection("notices").add(item);await listenNotices();}
    else{item.id="local_"+Date.now();st.notices.unshift(item);saveLocal()}
    const currentTitle=document.getElementById("noticeTitle"),currentBody=document.getElementById("noticeBody"),currentType=document.getElementById("noticeType");
    const current=currentTitle?{type:currentType.value,title:currentTitle.value,body:currentBody.value}:uiNoticeDraft||submitted;
    if(current.type===submitted.type&&current.title===submitted.title&&current.body===submitted.body){
      uiNoticeDraft={type:"공지",title:"",body:""};
      if(currentTitle){currentType.value="공지";currentTitle.value="";currentBody.value=""}
    }
    render();toast("공지사항이 등록되었습니다.");
  }catch(error){console.error(error);toast("공지 등록에 실패했습니다. 작성한 내용은 그대로 두었습니다.")}
  finally{uiNoticeSaving=false;if(button)button.disabled=false;const current=document.getElementById("noticeTitle");if(current){const next=current.closest(".form").querySelector("button");if(next)next.disabled=false}}
}
async function removeNotice(idv){if(firebaseOn){try{await db.collection("notices").doc(idv).delete();await listenNotices();toast("공지사항이 삭제되었습니다.")}catch(e){console.error(e);toast("삭제 중 오류가 발생했습니다.")}}else{st.notices=st.notices.filter(n=>n.id!==idv);saveLocal();render();toast("공지사항이 삭제되었습니다.")}}
function csv(rows){return "\uFEFF"+rows.map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\n")}
function download(name,text){const blob=new Blob([text],{type:"text/csv;charset=utf-8;"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function exportCsv(){const rows=[["날짜","입장시각","대기번호","호출상태","예약유형","예약인원","국·기관","부서","대표자","행정번호","예약상태","예약번호"]];st.reservations.filter(r=>r.date===st.date).forEach(r=>{const org=r.orgName||(organizationByKey(r.orgKey)||organizationByDepartment(r.dept)||{}).name||"";rows.push([r.date,r.time,queueNumberFor(r),r.callStatus||"waiting",reservationLabel(r),partySizeOf(r),org,r.dept,r.name,r.emp,r.status,r.code])});download("서구밥상_"+st.date+".csv",csv(rows));toast("CSV를 다운로드했습니다.")}

async function startScanner(){
  if(typeof jsQR==="undefined")return toast("QR 스캐너 라이브러리를 불러오지 못했습니다.");
  const area=document.getElementById("scannerArea");if(!area||uiScannerPending)return;
  stopScanner();
  const generation=uiScannerGeneration;uiScannerPending=true;
  area.innerHTML=`<div class="cameraBox"><video id="qrVideo" playsinline muted></video></div><div id="scanResult" class="scanResult">카메라 권한을 허용해주세요. QR이 인식되면 자동으로 입장 처리됩니다.</div><div class="btnrow"><button class="btn light full" onclick="stopScanner()">카메라 끄기</button></div><canvas id="qrCanvas" style="display:none"></canvas>`;
  let stream=null;
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("CAMERA_UNAVAILABLE");
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
    const video=document.getElementById("qrVideo");
    if(generation!==uiScannerGeneration||!area.isConnected||!video||!area.contains(video)){stream.getTracks().forEach(track=>track.stop());return}
    st.scanStream=stream;video.srcObject=stream;await video.play();
    if(generation!==uiScannerGeneration||!area.isConnected||st.scanStream!==stream){stream.getTracks().forEach(track=>track.stop());return}
    uiScannerPending=false;scanLoop();
  }catch(error){
    if(stream)stream.getTracks().forEach(track=>track.stop());
    if(generation!==uiScannerGeneration)return;
    if(st.scanStream===stream)st.scanStream=null;
    console.error(error);
    const result=document.getElementById("scanResult");if(result)result.textContent="카메라를 실행할 수 없습니다. 카메라 권한을 허용한 뒤 다시 켜주세요.";
  }finally{if(generation===uiScannerGeneration)uiScannerPending=false}
}
async function scanLoop(){const video=document.getElementById("qrVideo"),canvas=document.getElementById("qrCanvas"),result=document.getElementById("scanResult");if(!video||!canvas||!st.scanStream)return;const ctx=canvas.getContext("2d");if(video.readyState===video.HAVE_ENOUGH_DATA){canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.drawImage(video,0,0,canvas.width,canvas.height);const img=ctx.getImageData(0,0,canvas.width,canvas.height);const found=jsQR(img.data,canvas.width,canvas.height);if(found&&found.data){const msg=await checkinByCode(found.data);if(result)result.textContent=msg;stopScanner(false);toast(msg);return}}st.scanTimer=requestAnimationFrame(scanLoop)}
function stopScanner(clear=true){
  uiScannerGeneration++;uiScannerPending=false;
  if(st.scanTimer){cancelAnimationFrame(st.scanTimer);st.scanTimer=null}
  if(st.scanStream){st.scanStream.getTracks().forEach(track=>track.stop());st.scanStream=null}
  if(clear){const area=document.getElementById("scannerArea");if(area)area.innerHTML=""}
}
function resetLocal(){if(!confirm("로컬 데모 데이터를 초기화할까요?"))return;localStorage.removeItem("sg_real_reservations");localStorage.removeItem("sg_real_notices");localStorage.removeItem("sg_real_penalties");localStorage.removeItem("sg_real_queueControls");localStorage.removeItem("sg_real_seeded");st.reservations=[];st.notices=[];st.penalties={};st.queueControls={};seedLocalIfNeeded();render();toast("로컬 데이터가 초기화되었습니다.")}
function seedLocalIfNeeded(){if(localStorage.getItem("sg_real_seeded"))return;const today=fmt(new Date());st.notices=[{id:"n1",type:"공지",title:"시범 운영 안내",body:"서구밥상 시범 운영 중입니다. 예약 시간 분산에 협조해주시기 바랍니다.",createdAtMs:Date.now()},{id:"n2",type:"업데이트",title:"QR 체크인 준비",body:"관리자 화면에서 QR 카메라 인식 기능을 점검할 수 있습니다.",createdAtMs:Date.now()-1000}];saveLocal();localStorage.setItem("sg_real_seeded","1")}
