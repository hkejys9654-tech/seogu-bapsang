<html lang="ko">
<head>

<style>
:root{
  --bg:#f6f7f9;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;
  --orange:#ff7a21;--soft:#fff2e8;--green:#16a34a;--amber:#f59e0b;--red:#ef4444;
  --purple:#6d28d9;--shadow:0 10px 30px rgba(15,23,42,.08)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(#f6f7f9,#eceef2);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text)}
.app{max-width:430px;min-height:100vh;margin:0 auto;background:var(--bg)}
.top{position:sticky;top:0;z-index:10;background:rgba(246,247,249,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:18px 18px 10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:14px;border:0;background:linear-gradient(135deg,#ff944d,#ff6a00);color:#fff;font-weight:900;display:grid;place-items:center;box-shadow:var(--shadow);cursor:pointer}
.brand h1{font-size:20px;margin:0;line-height:1.1}.brand h1 span{color:var(--orange)}
.sub{font-size:13px;color:var(--muted);line-height:1.45}.tiny{font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--orange);border:1px solid #ffd9bf;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900;white-space:nowrap}
.badge.live{background:#ecfdf5;border-color:#a7f3d0;color:#047857}.badge.demo{background:#fef3c7;border-color:#fde68a;color:#92400e}
.content{padding:16px 16px 100px}
.card{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.title{font-size:18px;font-weight:900;margin:0 0 10px}
.btn{border:0;border-radius:16px;padding:14px 16px;font-size:15px;font-weight:900;cursor:pointer;transition:.15s ease}
.btn:active{transform:scale(.98)}.btn.primary{background:linear-gradient(135deg,#ff8b3d,#ff6a00);color:#fff;box-shadow:0 10px 20px rgba(255,106,0,.22)}
.btn.light{background:#fff;border:1px solid var(--line);color:var(--text)}.btn.soft{background:var(--soft);color:var(--orange);border:1px solid #ffd9bf}
.btn.green{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}.btn.danger{background:#fff1f2;color:#e11d48;border:1px solid #fecdd3}
.btn.small{padding:10px 12px;font-size:13px;border-radius:12px}.btn.full{width:100%}.btnrow{display:flex;gap:10px;margin-top:14px}
.hero{display:flex;gap:14px;align-items:flex-start}.platewrap{width:102px;flex:0 0 102px;height:102px;border-radius:26px;background:linear-gradient(#fff8e8,#f7eed1);border:1px solid #f0e2b7;display:grid;place-items:center}
.meal-name{font-size:18px;font-weight:900;margin:8px 0 6px}.menu-list{padding-left:18px;margin:0;font-size:14px;color:#374151;line-height:1.5}
.bar{height:11px;border-radius:999px;background:#eceff3;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#ff9b55,#ff6a00)}
.line{height:1px;background:var(--line);margin:14px 0}.detail{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f1f5f9;font-size:14px}.detail:last-child{border-bottom:0}.detail b{text-align:right}
.mini-card{padding:14px;border-radius:18px;background:#fff;border:1px solid var(--line)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:25;width:min(430px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.nav button{border:0;background:transparent;border-radius:16px;padding:8px 4px;color:#6b7280;font-weight:800;cursor:pointer}.nav button.active{background:var(--soft);color:var(--orange)}.nav b{display:block;font-size:20px}
.datebar{display:flex;gap:8px;margin:12px 0}.datebar .center{flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px;text-align:center;font-weight:900;cursor:pointer}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.quick button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px;font-weight:900;cursor:pointer}.quick button.active{border-color:#ffd9bf;background:var(--soft);color:var(--orange)}
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.slot{border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px 12px;text-align:left;cursor:pointer}.slot.mine{border-color:#ffb77f;background:var(--soft);box-shadow:0 8px 18px rgba(255,122,33,.11)}.slot.eligible-later{border-color:#bfdbfe;background:#f8fbff}.slot.active{border:2px solid var(--orange);background:#fff7ed;box-shadow:0 10px 22px rgba(255,122,33,.16)}.slot.disabled{opacity:.48;pointer-events:none}.slot-orgs{font-size:11px;color:#64748b;line-height:1.4;margin-top:6px}.slot.mine .slot-orgs{color:#c2410c;font-weight:800}.assignment-card{margin:14px 0;padding:14px;border-radius:18px;background:linear-gradient(135deg,#fff7ed,#fff);border:1px solid #fed7aa}.assignment-time{font-size:25px;font-weight:950;color:#ea580c;margin-top:4px}.assignment-org{font-size:13px;color:#7c2d12;font-weight:800;margin-top:3px}
.time{font-size:18px;font-weight:900}.meta{font-size:12px;color:var(--muted)}.status{font-size:12px;font-weight:900;margin-top:8px}.good{color:var(--green)}.mid{color:var(--amber)}.bad{color:var(--red)}.gray{color:#6b7280}
#qrBox{display:flex;justify-content:center;align-items:center;margin:12px auto;padding:14px;width:172px;min-height:172px;background:#fff;border-radius:22px;border:1px solid #ffe1c9}.code{padding:14px;border-radius:18px;background:#fff;border:1px dashed #f7b787;font-weight:900;font-size:14px;text-align:center;word-break:break-all}
.entry-ticket{position:relative;overflow:hidden;margin-top:14px;padding:18px;border-radius:24px;background:linear-gradient(145deg,var(--ticket-soft),#fff);border:2px solid var(--ticket-accent);text-align:center;box-shadow:0 14px 30px color-mix(in srgb,var(--ticket-accent) 18%,transparent);transition:.25s ease}
.entry-ticket::after{content:"";position:absolute;right:-35px;bottom:-45px;width:130px;height:130px;border-radius:999px;background:var(--ticket-accent);opacity:.07}.ticket-live{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--ticket-ink);font-size:11px;font-weight:900}.ticket-live b{font-variant-numeric:tabular-nums}.ticket-live-dot{width:8px;height:8px;border-radius:999px;background:var(--ticket-accent);box-shadow:0 0 0 0 var(--ticket-accent);animation:ticketPulse 1.5s infinite}.ticket-label{position:relative;z-index:1;margin-top:15px;color:var(--ticket-ink);font-size:14px;font-weight:900;letter-spacing:.08em}.ticket-time{position:relative;z-index:1;color:var(--ticket-accent);font-size:58px;line-height:1;font-weight:950;letter-spacing:-.06em;margin:6px 0}.ticket-status{position:relative;z-index:1;display:inline-flex;padding:7px 14px;border-radius:999px;background:var(--ticket-accent);color:#fff;font-size:14px;font-weight:950}.ticket-owner{position:relative;z-index:1;margin-top:14px;font-size:14px;font-weight:950;color:#1f2937}.ticket-date{position:relative;z-index:1;margin-top:4px;font-size:12px;color:#64748b}.qr-help{text-align:center;font-size:12px;color:#6b7280;font-weight:800;margin-top:16px}.qr-caption{text-align:center;font-size:11px;color:#94a3b8;margin:-3px 0 12px}@keyframes ticketPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ticket-accent) 45%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.ticket-call{position:relative;z-index:1;margin:14px -8px 4px;padding:18px 10px;border-radius:18px;background:var(--ticket-accent);color:#fff;font-size:25px;font-weight:950;letter-spacing:-.04em}.ticket-queue{position:relative;z-index:1;margin-top:10px;color:var(--ticket-ink);font-size:15px;font-weight:950}.ticket-token{position:relative;z-index:1;margin-top:10px;padding:10px 12px;border:2px dashed var(--ticket-accent);border-radius:14px;color:var(--ticket-ink);font-size:18px;font-weight:950;background:rgba(255,255,255,.72)}
.pill{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:900;white-space:nowrap}.reserve{background:#fff7ed;color:#ea580c}.checkin{background:#ecfdf5;color:#047857}.cancel{background:#fef2f2;color:#dc2626}
.notice-card{background:linear-gradient(#fff,#faf8ff);border:1px solid #ebe5ff}.notice-item{padding:12px 0;border-bottom:1px solid #f0edf9}.notice-item:last-child{border-bottom:0;padding-bottom:0}.notice-tag{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:900;background:#f3f0ff;color:var(--purple);margin-bottom:6px}.notice-text{font-size:14px;color:#374151;line-height:1.45}
.notice{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:16px;padding:12px;font-size:13px;margin-top:14px;line-height:1.5}
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.44);display:none;align-items:flex-end;justify-content:center;z-index:80;padding:18px}.overlay.show{display:flex}.sheet{width:min(430px,100%);background:#fff;border-radius:28px 28px 18px 18px;box-shadow:0 25px 60px rgba(0,0,0,.25);max-height:92vh;overflow:auto}.sheethead{padding:16px 18px;border-bottom:1px solid var(--line)}.sheetbody{padding:18px}.form{display:flex;flex-direction:column;gap:12px}.input,.select,.file,textarea{width:100%;border:1px solid var(--line);border-radius:16px;padding:14px;font-size:15px;background:#fff;outline:none;font-family:inherit}textarea{min-height:120px;resize:vertical}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(30px);bottom:96px;z-index:60;background:#111827;color:#fff;padding:12px 16px;border-radius:14px;font-size:13px;font-weight:900;opacity:0;transition:.25s;max-width:calc(100% - 40px)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.admin-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}.admin-tabs button{border:1px solid var(--line);background:#fff;padding:10px 4px;border-radius:12px;font-size:11px;font-weight:900;cursor:pointer}.admin-tabs button.active{background:var(--soft);border-color:#ffd9bf;color:var(--orange)}
.cameraBox{overflow:hidden;border-radius:18px;border:1px solid var(--line);background:#000;aspect-ratio:3/4;display:grid;place-items:center}.cameraBox video{width:100%;height:100%;object-fit:cover}.scanResult{margin-top:10px;padding:12px;border-radius:14px;background:#f8fafc;border:1px solid #e2e8f0;font-size:13px;line-height:1.45}.reservation-item{border:1px solid var(--line);border-radius:18px;padding:12px;background:#fff;margin-bottom:10px}
.call-slot-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}.call-slot-grid button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 2px;font-size:12px;font-weight:900;cursor:pointer}.call-slot-grid button.active{background:#123a6b;border-color:#123a6b;color:#fff}.call-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.call-stat{padding:12px 6px;border-radius:14px;text-align:center;border:1px solid var(--line);background:#fff}.call-stat b{display:block;font-size:24px;margin-bottom:3px}.call-stat span{font-size:11px;color:var(--muted);font-weight:900}.call-stat.green{background:#ecfdf5;border-color:#86efac;color:#047857}.call-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.call-buttons button{padding:16px 4px;font-size:16px}.call-live-board{margin:14px 0;padding:18px;border-radius:20px;background:#ecfdf5;border:2px solid #22c55e;text-align:center;color:#065f46}.call-live-board.wait{background:#f8fafc;border-color:#cbd5e1;color:#475569}.call-live-board .call-number{font-size:32px;font-weight:950;letter-spacing:-.04em}.call-live-board .call-token-big{margin-top:8px;font-size:21px;font-weight:950}.call-help{margin-top:12px;padding:12px;border-radius:14px;background:#f8fafc;color:#475569;font-size:12px;line-height:1.55}.push-card{margin-top:14px;padding:14px;border:1px solid #bfdbfe;border-radius:18px;background:linear-gradient(135deg,#eff6ff,#fff)}.push-state{display:inline-flex;margin-top:8px;padding:5px 9px;border-radius:999px;background:#e2e8f0;color:#475569;font-size:11px;font-weight:900}.push-state.on{background:#dcfce7;color:#166534}.requeue-box{margin-top:14px;padding:14px;border-radius:18px;background:#fff7ed;border:1px solid #fdba74;text-align:center}.requeue-box b{display:block;color:#9a3412;margin-bottom:5px}.slot-closed{background:#fef2f2!important;border-color:#fecaca!important;color:#991b1b!important}

.dashboard-card{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 92% 4%, rgba(255,122,33,.18), transparent 28%),
    linear-gradient(180deg,#ffffff 0%,#fffaf5 100%);
  border:1px solid #ffe2ca;
}
.dashboard-card::after{
  content:"";
  position:absolute;
  right:-34px;
  top:-34px;
  width:118px;
  height:118px;
  border-radius:999px;
  background:rgba(255,122,33,.08);
}
.reserve-status-card{background:#fff;border:1px solid #f1f5f9;border-radius:18px;padding:13px;margin-top:14px}
.notice-card{background:linear-gradient(180deg,#fff,#fbfaff);border:1px solid #ede7ff}


.calendar-pop{
  margin-top:10px;
  padding:12px;
  border-radius:18px;
  border:1px solid #e5e7eb;
  background:#fff;
}
.calendar-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:10px;
}
.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}
.calendar-weekday{
  text-align:center;
  font-size:11px;
  color:#6b7280;
  font-weight:900;
  padding:4px 0;
}
.calendar-day{
  border:1px solid #f1f5f9;
  background:#fff;
  border-radius:12px;
  padding:8px 0;
  font-size:13px;
  font-weight:900;
  cursor:pointer;
}
.calendar-day.muted{
  color:#cbd5e1;
  background:#f8fafc;
}
.calendar-day.active{
  color:#fff;
  border-color:#ff7a21;
  background:#ff7a21;
}
.noshow-warning{
  margin-top:14px;
  padding:13px;
  border-radius:16px;
  background:#fff1f2;
  border:1px solid #fecdd3;
  color:#9f1239;
  font-size:13px;
  line-height:1.5;
  font-weight:800;
}
.noshow-row{
  background:#fff7ed;
  border-color:#fed7aa;
}


.reserve-focus-card{
  position:relative;
  overflow:hidden;
  background:linear-gradient(180deg,#fff7ed 0%,#ffffff 100%);
  border:1.5px solid #fed7aa;
  box-shadow:0 16px 34px rgba(255,122,33,.14);
}
.reserve-focus-card::before{
  content:"";
  position:absolute;
  top:-46px;
  right:-46px;
  width:132px;
  height:132px;
  border-radius:999px;
  background:rgba(255,122,33,.13);
}
.reserve-focus-head{
  position:relative;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
}
.reserve-focus-title{
  font-size:21px;
  font-weight:950;
  letter-spacing:-.4px;
  margin:0 0 5px;
}
.reserve-focus-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:44px;
  height:44px;
  border-radius:16px;
  color:#fff;
  font-size:20px;
  background:linear-gradient(135deg,#ff8b3d,#ff6a00);
  box-shadow:0 10px 20px rgba(255,106,0,.24);
}
.reserve-info-grid{
  position:relative;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:14px;
}
.reserve-info-cell{
  padding:10px 8px;
  border-radius:14px;
  border:1px solid #ffedd5;
  background:rgba(255,255,255,.72);
  text-align:center;
}
.reserve-info-cell b{display:block;font-size:13px;margin-top:3px;color:#111827}
.reserve-info-cell span{font-size:11px;color:#9a3412;font-weight:900}
.booking-type{position:relative;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 14px;padding:5px;border-radius:18px;background:#fff;border:1px solid #fed7aa}
.booking-type button{border:0;border-radius:13px;padding:12px 8px;background:transparent;color:#78716c;font-size:14px;font-weight:950;cursor:pointer}
.booking-type button.active{background:linear-gradient(135deg,#ff8b3d,#ff6a00);color:#fff;box-shadow:0 8px 16px rgba(255,106,0,.2)}
.party-picker{position:relative;margin:0 0 14px;padding:14px;border-radius:18px;background:#fff;border:1px solid #fdba74}
.party-picker-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.party-stepper{display:flex;align-items:center;gap:10px}
.party-stepper button{width:38px;height:38px;border:1px solid #fed7aa;border-radius:12px;background:#fff7ed;color:#c2410c;font-size:21px;font-weight:950;cursor:pointer}
.party-count{min-width:52px;text-align:center;color:#ea580c;font-size:25px;font-weight:950;font-variant-numeric:tabular-nums}
.party-note{margin-top:9px;color:#7c2d12;font-size:12px;font-weight:800;line-height:1.5}
.party-badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:#ede9fe;color:#6d28d9;font-size:11px;font-weight:950;white-space:nowrap}
.reserve-guide-text{
  position:relative;
  font-size:13px;
  color:#9a3412;
  font-weight:800;
  margin-bottom:12px;
  line-height:1.45;
}
/* 간결한 예약 화면 */
.hello{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 2px 12px}
.hello-name{font-size:21px;font-weight:950;letter-spacing:-.4px}
.hello-slot{flex:0 0 auto;text-align:center;padding:8px 12px;border-radius:16px;background:var(--soft);border:1px solid #ffd9bf}
.hello-slot span{display:block;font-size:11px;font-weight:900;color:#c2410c}.hello-slot b{font-size:18px;color:var(--orange);font-variant-numeric:tabular-nums}
.notice-strip{display:flex;align-items:center;gap:8px;width:100%;margin:0 0 12px;padding:10px 12px;border-radius:14px;border:1px solid #ede7ff;background:#fbfaff;text-align:left;cursor:pointer;font:inherit;color:var(--text)}
.notice-strip .notice-tag{margin:0;flex:0 0 auto}.ns-title{flex:1;min-width:0;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book-card{padding:18px 16px 16px}
.step{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:950;margin:4px 0 10px}
.step:not(:first-child){margin-top:18px}
.step-no{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:999px;background:var(--orange);color:#fff;font-size:13px}
.step-help{margin:-4px 0 10px}
.book-card .booking-type{margin-bottom:10px}
.party-inline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:16px;background:#fff7ed;border:1px solid #fed7aa;font-size:13px;font-weight:900;color:#9a3412}
.slot-list{display:flex;flex-direction:column;gap:8px}
.slot-row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:16px;border:1.5px solid var(--line);background:#fff;font:inherit;color:var(--text);text-align:left;cursor:pointer;transition:border-color .12s,background .12s}
.slot-row.active{border-color:var(--orange);background:#fff7ed;box-shadow:0 8px 18px rgba(255,122,33,.14)}
.slot-row.disabled{opacity:.45;background:#f8fafc}
.sr-radio{flex:0 0 auto;width:20px;height:20px;border-radius:999px;border:2px solid #d1d5db;background:#fff}
.slot-row.active .sr-radio{border-color:var(--orange);box-shadow:inset 0 0 0 4px #fff;background:var(--orange)}
.sr-time{flex:0 0 auto;font-size:20px;font-weight:950;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.sr-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}

      <div class="booking-type" aria-label="예약 구분">

      </div>
      ${st.bookingType==="group"?`<div class="party-inline"><span>대표자 포함 인원</span><div class="party-stepper"><button onclick="changePartySize(-1)" aria-label="인원 줄이기">−</button><div class="party-count">${partySize}명</div><button onclick="changePartySize(1)" aria-label="인원 늘리기">＋</button></div></div>`:""}
      <div class="step"><span class="step-no">2</span>언제 들어갈까요?</div>
      ${assigned?`<div class="tiny step-help">${esc(assigned)}부터 고를 수 있어요. 타임마다 ${SLOTS[0][1]}명까지 입장합니다.</div>`:`<div class="notice">직원 정보를 먼저 등록해주세요.</div>`}
      <div class="slot-list">${SLOTS.map(s=>slotRow(s,bookingDate,org,assigned,partySize,blocked)).join("")}</div>
      ${blocked?`<div class="noshow-warning">${blockMessage(st.user.emp,bookingDate)}</div>`:""}
      <div class="cta-sticky"><button class="btn primary full big" onclick="reserve()" ${canBook?"":"disabled"}>${!st.user?"직원 정보 등록 필요":blocked?"오늘은 예약할 수 없어요":canBook?`${st.slot} · ${partySize>1?partySize+"명 ":""}예약하기`:"시간을 골라주세요"}</button></div>

  my(){

        <div class="ticket-label">입장 예약시간</div>

        <div class="ticket-date">${pretty(r.date)} · ${esc(r.place)}</div>

function slotRow(s,date,org,assigned,partySize,blocked){
  const time=s[0],cap=s[1],rem=remain(date,time),used=cap-rem,eligible=isEligibleTime(time,date,org),overflow=isOverflowChoice(time,date,org),available=!blocked&&canBookTime(date,time,org,partySize),active=available&&st.slot===time,stt=status(rem,cap),shared=overflowRemain(date,time);
  const tag=!org?["",""]:!eligible?["배정 전","gray"]:rem<=0?["마감","gray"]:!available?[partySize>rem?"자리 부족":"공유석 마감","gray"]:time===assigned?["기본",stt[1]]:[stt[0],stt[1]];

}

function notificationTimeout(promise,ms=12000){

async function ensureCallWorker(){

      const worker=registration.installing||registration.waiting||registration.active;
      if(!worker)throw new Error("NO_NOTIFICATION_WORKER");
      let changed;
      try{
        await notificationTimeout(new Promise((resolve,reject)=>{
          changed=()=>{if(worker.state==="activated")resolve();else if(worker.state==="redundant")reject(new Error("NOTIFICATION_WORKER_FAILED"))};
          worker.addEventListener("statechange",changed);changed();
        }));
      }finally{worker.removeEventListener("statechange",changed)}

    return registration;
  })();

}
async function enablePushNotifications(){await setupPushMessaging(true)}
async function setupPushMessaging(requestPermission=false){

  try{return await pushSetupPending}finally{pushSetupPending=null}
}
async function connectCallNotifications(requestPermission){
  const user=st.user&&{...st.user};
  if(!user){if(requestPermission)toast("직원 정보를 먼저 등록해주세요.");return}
  if(!("serviceWorker" in navigator)||notificationPermission()==="unsupported"){if(requestPermission)toast("이 브라우저는 호출 알림을 지원하지 않습니다.");return}
  let localReady=false;
  pushConnection={mode:"connecting",emp:user.emp,reason:""};render();
  // Older versions stored success before registration. Never reuse that flag as proof of connection.
  localStorage.removeItem("sg_push_enabled");
  try{
    let permission=Notification.permission;
    if(requestPermission&&permission==="default")permission=await Notification.requestPermission();
    if(permission!=="granted"){
      pushConnection={mode:"idle",emp:user.emp,reason:""};
      if(requestPermission)toast(permission==="denied"?"브라우저 사이트 설정에서 알림을 허용해주세요.":"알림 권한이 허용되지 않았습니다.");
      return;
    }
    const registration=await ensureCallWorker();localReady=true;
    if(!st.user||st.user.emp!==user.emp)return;
    pushConnection={mode:"local",emp:user.emp,reason:"unconfigured"};
    if(firebaseOn&&PUSH_VAPID_KEY&&typeof firebase.messaging==="function"&&await firebase.messaging.isSupported()){
      messaging=messaging||firebase.messaging();
      const token=await notificationTimeout(messaging.getToken({serviceWorkerRegistration:registration,vapidKey:PUSH_VAPID_KEY}));
      if(!token)throw new Error("PUSH_TOKEN_EMPTY");
      if(!st.user||st.user.emp!==user.emp)return;
      const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
      try{
        const response=await fetch(PUSH_REGISTER_ENDPOINT,{method:"POST",signal:controller.signal,headers:{"Content-Type":"application/json"},body:JSON.stringify({token,emp:user.emp,name:user.name,orgKey:user.orgKey||"",dept:user.dept})});
        if(!response.ok)throw new Error("PUSH_REGISTER_FAILED");
        const result=await response.json();
        if(result.ok!==true)throw new Error("PUSH_REGISTER_UNCONFIRMED");
      }finally{clearTimeout(timer)}
      if(!st.user||st.user.emp!==user.emp)return;
      pushConnection={mode:"push",emp:user.emp,reason:""};
      // Foreground calls are displayed by the reservation snapshot listener only.
      // Also displaying onMessage would notify twice for the same call.
    }
    if(requestPermission)toast(pushConnection.mode==="push"?"백그라운드 호출 알림이 등록되었습니다.":"앱 실행 중 호출 알림이 켜졌습니다. 앱을 열어두세요.");
  }catch(error){
    console.warn("Call notification connection failed.");
    if(st.user&&st.user.emp===user.emp){
      pushConnection={mode:localReady?"local":"error",emp:user.emp,reason:"failed"};
      if(requestPermission)toast(localReady?"앱 실행 중 알림만 사용 가능합니다. 추가 연결을 다시 시도해주세요.":"알림 연결에 실패했습니다. 다시 연결해주세요.");
    }
  }finally{render()}
}
async function showCallNotification(title,body,url="./?open=my"){

  try{const registration=await ensureCallWorker();await registration.showNotification(title,{body,icon:"./icon-192.png",badge:"./icon-192.png",tag:"seogu-entry-call",renotify:true,vibrate:[250,120,250,120,400],data:{url}})}catch(error){console.warn("Call notification could not be displayed.")}

function notifyCall(r){

  if(pushConnection.mode==="push"&&pushConnection.emp===st.user.emp&&document.visibilityState==="hidden")return;

}

function rotationMonthIndex(date){const d=new Date(date+"T00:00:00"),raw=(d.getFullYear()-ROTATION_BASE_YEAR)*12+(d.getMonth()-ROTATION_BASE_MONTH);return((raw%5)+5)%5}

function listenReservations(){
  if(!firebaseOn||!db)return;
  if(unsubReservations)unsubReservations();
  unsubReservations=db.collection("reservations").where("date","==",st.date).onSnapshot(snap=>{
    const previous=new Map(st.reservations.map(r=>[r.id,r]));
    const next=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(reservationSnapshotReady&&st.user){
      next.filter(r=>r.emp===st.user.emp&&r.callStatus==="called"&&previous.get(r.id)?.callStatus!=="called").forEach(notifyCall);
    }
    st.reservations=next;
    reservationSnapshotReady=true;
    render();
  },err=>{console.error(err);toast("예약 데이터를 불러오지 못했습니다.");});
}

async function reserveFirebase(){
  const bookingDate=todayDate();
  const org=userOrganization(),assigned=org?assignedSlot(org.key,bookingDate):"",partySize=selectedPartySize();
  if(!org||!isEligibleTime(st.slot,bookingDate,org))return toast("기본 배정시간보다 이른 시간은 예약할 수 없습니다.");
  const overflow=isOverflowChoice(st.slot,bookingDate,org);
  const rRef=db.collection("reservations").doc(docId(bookingDate,st.user.emp));
  const sRef=db.collection("slotCounts").doc(slotId(bookingDate,st.slot));
  const late=reservationDeadlinePassed();
  try{
    await db.runTransaction(async tx=>{
      const rSnap=await tx.get(rRef);
      if(rSnap.exists&&rSnap.data().status!=="cancelled") throw new Error("EXISTS");
      const pSnap=await tx.get(db.collection("penalties").doc(st.user.emp));
      if(pSnap.exists&&pSnap.data().blockDate===bookingDate) throw new Error("BLOCKED");
      const cap=SLOTS.find(s=>s[0]===st.slot)[1];
      let queueNumber=0;
      if(!late){
        const sSnap=await tx.get(sRef);
        const count=sSnap.exists?(sSnap.data().count||0):0;
        const overflowCountNow=sSnap.exists?(sSnap.data().overflowCount||0):0;
        queueNumber=(sSnap.exists?(sSnap.data().nextQueueNumber||count):count)+1;
        if(count+partySize>cap) throw new Error("FULL");
        if(overflow&&!overflowQuotaReleased()&&overflowCountNow+partySize>EARLY_OVERFLOW_QUOTA)throw new Error("OVERFLOW_FULL");
        tx.set(sRef,{date:bookingDate,time:st.slot,cap,count:count+partySize,overflowCount:overflowCountNow+(overflow?partySize:0),nextQueueNumber:queueNumber,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
      }
      tx.set(rRef,{name:st.user.name,orgKey:org.key,orgName:org.name,dept:st.user.dept,emp:st.user.emp,date:bookingDate,time:st.slot,originalTime:st.slot,assignedTime:assigned,isOverflow:overflow,queueNumber,requeueCount:0,callStatus:"waiting",reservationType:partySize>1?"group":"individual",partySize,meal:"점심식사",place:"본관 구내식당",loc:"서구청 본관 지하 1층",status:late?"late":"reserved",qrEligible:!late,code:late?"":code(bookingDate,st.slot,st.user.emp),createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    });
    go("my");toast(late?lateReservationNotice():partySize>1?`${partySize}명 단체 예약이 완료되었습니다.`:"개인 예약이 완료되었습니다.");
  }catch(e){console.error(e);if(String(e.message).includes("EXISTS"))toast("이미 오늘 예약이 있습니다.");else if(String(e.message).includes("BLOCKED"))toast("노쇼 이력으로 오늘 예약이 제한됩니다.");else if(String(e.message).includes("OVERFLOW_FULL"))toast("선택한 시간의 공유 좌석이 마감되었습니다.");else if(String(e.message).includes("FULL"))toast("선택한 시간은 마감되었습니다.");else toast("예약 처리 중 오류가 발생했습니다.")}
}
async function cancelRes(idv){

async function cancelFirebase(idv){
  if(!idv) return toast("취소할 예약 정보를 찾지 못했습니다.");
  const rRef=db.collection("reservations").doc(idv);

  try{
    await db.runTransaction(async tx=>{
      // Firestore 트랜잭션은 읽기를 먼저 모두 끝낸 뒤 쓰기를 해야 합니다.
      const rSnap=await tx.get(rRef);
      if(!rSnap.exists) throw new Error("NO");

      const r=rSnap.data();
      if(r.status==="checkedin") throw new Error("CHECKED");
      if(r.status==="cancelled") throw new Error("ALREADY_CANCELLED");

      const shouldDecreaseSlotCount =
        r.status==="reserved" &&
        r.qrEligible!==false &&
        r.date &&
        r.time;

      let sRef=null;
      let newCount=null;
      let newOverflowCount=null;

      // slotCounts도 update 전에 먼저 읽어둡니다.
      if(shouldDecreaseSlotCount){
        sRef=db.collection("slotCounts").doc(slotId(r.date,r.time));
        const sSnap=await tx.get(sRef);
        const count=sSnap.exists?(sSnap.data().count||0):0;
        const overflowCountNow=sSnap.exists?(sSnap.data().overflowCount||0):0;
        const partySize=partySizeOf(r);
        newCount=Math.max(0,count-partySize);
        newOverflowCount=Math.max(0,overflowCountNow-(r.isOverflow?partySize:0));
      }

      tx.update(rRef,{
        status:"cancelled",
        updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      });

      if(sRef){
        tx.set(sRef,{
          count:newCount,
          overflowCount:newOverflowCount,
          updatedAt:firebase.firestore.FieldValue.serverTimestamp()
        },{merge:true});
      }
    });

    st.reservations = st.reservations.map(r => r.id===idv ? {...r,status:"cancelled"} : r);
    render();
    toast("예약이 취소되었습니다.");
  }catch(e){
    console.error(e);
    const msg=String(e.message||"");
    if(msg.includes("CHECKED")) toast("이미 입장 처리된 예약입니다.");
    else if(msg.includes("ALREADY_CANCELLED")) toast("이미 취소된 예약입니다.");
    else if(msg.includes("NO")) toast("예약 정보를 찾지 못했습니다.");
    else toast("예약 취소 중 오류가 발생했습니다.");
  }
}

function requeueTarget(r){
  const start=Math.max(0,slotIndex(r.time));
  const partySize=partySizeOf(r);
  for(let i=start;i<SLOTS.length;i++){
    const time=SLOTS[i][0];
    if(isQueueClosed(r.date,time))continue;
    if(time===r.time||remain(r.date,time)>=partySize)return time;
  }
  return "";
}
async function requestRequeue(idv){
  const current=st.reservations.find(r=>r.id===idv);
  if(!current)return toast("예약 정보를 찾지 못했습니다.");
  if(current.callStatus!=="passed")return toast("호출이 지난 예약만 다시 대기할 수 있습니다.");
  if(Number(current.requeueCount||0)>=1)return toast("재대기 기회를 이미 사용했습니다.");
  const target=requeueTarget(current);
  if(!target)return toast("이후 시간대에 남은 자리가 없습니다. 안내자에게 문의해주세요.");
  if(firebaseOn)return requestRequeueFirebase(idv,target);
  const number=Math.max(0,...st.reservations.filter(r=>r.date===current.date&&r.time===target).map(r=>Number(r.queueNumber)||0))+1;
  const oldTime=current.time;
  Object.assign(current,{time:target,originalTime:current.originalTime||oldTime,queueNumber:number,requeueCount:1,callStatus:"waiting",callToken:"",isOverflow:target!==(current.assignedTime||oldTime),requeuedAt:Date.now(),updatedAt:Date.now()});
  saveLocal();render();toast(oldTime===target?`${target} 대기열 맨 뒤로 이동했습니다.`:`${target} 잔여석 대기열로 이동했습니다.`);
}
async function requestRequeueFirebase(idv,target){
  const rRef=db.collection("reservations").doc(idv);
  try{
    let oldTime="";
    await db.runTransaction(async tx=>{
      const rSnap=await tx.get(rRef);if(!rSnap.exists)throw new Error("NO");
       const r=rSnap.data();oldTime=r.time;const partySize=partySizeOf(r);
      if(r.callStatus!=="passed")throw new Error("NOT_PASSED");
      if(Number(r.requeueCount||0)>=1)throw new Error("USED");
      const controlSnap=await tx.get(db.collection("queueControls").doc(queueControlKey(r.date,target)));
      if(controlSnap.exists&&controlSnap.data().closed===true)throw new Error("CLOSED");
      const oldRef=db.collection("slotCounts").doc(slotId(r.date,r.time));
      const targetRef=db.collection("slotCounts").doc(slotId(r.date,target));
      const oldSnap=await tx.get(oldRef);
      const targetSnap=target===r.time?oldSnap:await tx.get(targetRef);
      const targetCap=SLOTS.find(s=>s[0]===target)[1];
      const targetCount=targetSnap.exists?(targetSnap.data().count||0):0;
      const nextNumber=(targetSnap.exists?(targetSnap.data().nextQueueNumber||targetCount):targetCount)+1;
       if(target!==r.time&&targetCount+partySize>targetCap)throw new Error("FULL");
      const now=firebase.firestore.FieldValue.serverTimestamp();
      if(target===r.time){
        tx.set(targetRef,{nextQueueNumber:nextNumber,updatedAt:now},{merge:true});
      }else{
        const oldCount=oldSnap.exists?(oldSnap.data().count||0):0,oldOverflow=oldSnap.exists?(oldSnap.data().overflowCount||0):0,targetOverflow=targetSnap.exists?(targetSnap.data().overflowCount||0):0,newOverflow=target!==(r.assignedTime||r.time);
         tx.set(oldRef,{count:Math.max(0,oldCount-partySize),overflowCount:Math.max(0,oldOverflow-(r.isOverflow?partySize:0)),updatedAt:now},{merge:true});
         tx.set(targetRef,{date:r.date,time:target,cap:targetCap,count:targetCount+partySize,overflowCount:targetOverflow+(newOverflow?partySize:0),nextQueueNumber:nextNumber,updatedAt:now},{merge:true});
      }
      tx.update(rRef,{time:target,originalTime:r.originalTime||r.time,queueNumber:nextNumber,requeueCount:1,callStatus:"waiting",callToken:firebase.firestore.FieldValue.delete(),callBatchId:firebase.firestore.FieldValue.delete(),isOverflow:target!==(r.assignedTime||r.time),requeuedAt:now,updatedAt:now});
    });
    toast(oldTime===target?`${target} 대기열 맨 뒤로 이동했습니다.`:`${target} 잔여석 대기열로 이동했습니다.`);
  }catch(e){console.error(e);const msg=String(e.message||"");if(msg.includes("USED"))toast("재대기 기회를 이미 사용했습니다.");else if(msg.includes("FULL")||msg.includes("CLOSED"))toast("선택 가능한 이후 시간대가 마감되었습니다.");else toast("재대기 처리 중 오류가 발생했습니다.")}
}

// Shared by manual and QR entry; Firebase callers validate fresh data inside a transaction.
function checkinValidationMessage(r,qrText=null,penalty=null){
  if(!r)return "예약 정보를 찾지 못했습니다.";
  if(r.date!==todayDate())return "오늘 날짜의 예약만 입장 처리할 수 있습니다.";
  if(r.status==="checkedin")return `${r.name}님은 이미 입장 처리되었습니다.`;
  if(r.status==="cancelled")return `${r.name}님은 취소된 예약입니다.`;
  if(r.status==="noshow")return `${r.name}님은 노쇼 처리된 예약입니다. 관리자 확인이 필요합니다.`;
  // Manual entry retains the existing demo workflow for recorded late reservations.
  if(r.status!=="reserved"&&!isLateReservationStatus(r.status))return "입장 처리할 수 없는 예약 상태입니다.";
  if(qrText!==null){
    if(r.status!=="reserved"||r.qrEligible===false)return "QR 입장을 사용할 수 없는 예약입니다. 안내자에게 문의해주세요.";
    if(!r.code||r.code!==qrText)return "현재 예약의 QR 코드와 일치하지 않습니다.";
    if(r.callStatus!=="called")return r.callStatus==="passed"?`${r.name}님의 호출이 지났습니다. 안내자 확인이 필요합니다.`:`${r.name}님은 아직 입장 호출 전입니다.`;
  }
  if(penalty&&penalty.blockDate===r.date)return `${r.name}님은 노쇼 제한 대상입니다. 관리자 확인이 필요합니다.`;
  return "";
}
async function completeReservationCheckin(idv,qrText=null){
  if(firebaseOn){
    return db.runTransaction(async tx=>{
      const ref=db.collection("reservations").doc(idv),snap=await tx.get(ref);
      const r=snap.exists?snap.data():null;
      const invalid=checkinValidationMessage(r,qrText);
      if(invalid)return {error:invalid};
      const penaltySnap=await tx.get(db.collection("penalties").doc(r.emp));
      const blocked=checkinValidationMessage(r,qrText,penaltySnap.exists?penaltySnap.data():null);
      if(blocked)return {error:blocked};
      tx.update(ref,{status:"checkedin",updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
      return {reservation:r};
    });
  }
  const r=st.reservations.find(x=>x.id===idv);
  const invalid=checkinValidationMessage(r,qrText,r&&st.penalties[r.emp]);
  if(invalid)return {error:invalid};
  r.status="checkedin";saveLocal();render();
  return {reservation:r};
}
async function checkin(idv){
  try{
    const result=await completeReservationCheckin(idv);
    toast(result.error||`${partySizeOf(result.reservation)}명 입장 처리 완료`);
  }catch(e){console.error(e);toast("입장 처리 중 오류가 발생했습니다. 연결 상태를 확인한 후 다시 시도해주세요.")}
}
async function checkinByCode(text){
  if(!text)return "QR 정보가 없습니다.";
  // Date and employee number locate the record; the full stored code must also match.
  const qrText=String(text),parts=qrText.split("|");
  if(parts.length!==4||parts[0]!=="SGMEAL"||!/^\d{4}-\d{2}-\d{2}$/.test(parts[1])||!/^\d{2}:\d{2}$/.test(parts[2])||!/^\d{4}$/.test(parts[3]))return "서구밥상 예약 QR 코드가 아닙니다.";
  try{
    const result=await completeReservationCheckin(docId(parts[1],parts[3]),qrText);
    if(result.error)return result.error;
    const r=result.reservation;
    return `${r.name}님 ${partySizeOf(r)}명 입장 처리 완료: ${r.time}`;
  }catch(e){console.error(e);return "입장 처리 중 오류가 발생했습니다. 연결 상태를 확인한 후 다시 시도해주세요."}
}

async function callNext(size){
  if(st.date!==todayDate())return toast("오늘 날짜에서만 입장 인원을 호출할 수 있습니다.");
  if(isQueueClosed(st.date,st.adminCallSlot))return toast("마감된 시간대는 호출할 수 없습니다.");
  const date=st.date,time=st.adminCallSlot,rows=queueRows(date,time),active=rows.filter(r=>r.status==="reserved"&&r.callStatus==="called"),waitingRows=rows.filter(r=>r.status==="reserved"&&r.callStatus!=="called"&&r.callStatus!=="passed"),waiting=takeWaitingByPeople(waitingRows,size),calledPeople=totalPeople(waiting);
  if(!waiting.length)return toast("호출할 대기자가 없습니다.");
  const token=newCallToken(),batchId=date+"_"+time.replace(":","")+"_"+Date.now();
  if(firebaseOn){
    try{
      const batch=db.batch(),now=firebase.firestore.FieldValue.serverTimestamp();
      active.forEach(r=>batch.update(db.collection("reservations").doc(r.id),{callStatus:"passed",passedAt:now,updatedAt:now}));
      waiting.forEach(r=>batch.update(db.collection("reservations").doc(r.id),{callStatus:"called",callToken:token,callBatchId:batchId,calledAt:now,updatedAt:now}));
      await batch.commit();toast(`${time} 대기자 ${calledPeople}명을 호출했습니다.`);
    }catch(e){console.error(e);toast("입장 호출 중 오류가 발생했습니다.")}
    return;
  }
  active.forEach(r=>{r.callStatus="passed";r.passedAt=Date.now()});
  waiting.forEach(r=>{r.callStatus="called";r.callToken=token;r.callBatchId=batchId;r.calledAt=Date.now()});
  waiting.filter(r=>st.user&&r.emp===st.user.emp).forEach(notifyCall);
  saveLocal();render();toast(`${time} 대기자 ${calledPeople}명을 호출했습니다.`);
}

async function toggleQueueClosed(){
  if(st.date!==todayDate())return toast("오늘 시간대만 운영 상태를 바꿀 수 있습니다.");
  const id=queueControlKey(st.date,st.adminCallSlot),closed=!isQueueClosed(st.date,st.adminCallSlot),item={date:st.date,time:st.adminCallSlot,closed,updatedAtMs:Date.now()},active=queueRows(st.date,st.adminCallSlot).filter(r=>r.status==="reserved"&&r.callStatus==="called");
  if(firebaseOn){try{const batch=db.batch(),now=firebase.firestore.FieldValue.serverTimestamp();batch.set(db.collection("queueControls").doc(id),{...item,updatedAt:now},{merge:true});if(closed)active.forEach(r=>batch.update(db.collection("reservations").doc(r.id),{callStatus:"passed",passedAt:now,updatedAt:now}));await batch.commit();toast(closed?`${st.adminCallSlot} 시간대를 마감했습니다.`:`${st.adminCallSlot} 시간대를 다시 열었습니다.`)}catch(e){console.error(e);toast("시간대 운영상태 변경 중 오류가 발생했습니다.")}return}
  if(closed)active.forEach(r=>{r.callStatus="passed";r.passedAt=Date.now()});st.queueControls[id]=item;saveLocal();render();toast(closed?`${st.adminCallSlot} 시간대를 마감했습니다.`:`${st.adminCallSlot} 시간대를 다시 열었습니다.`);
}

async function startScanner(){if(typeof jsQR==="undefined")return toast("QR 스캐너 라이브러리를 불러오지 못했습니다.");const area=document.getElementById("scannerArea");if(!area)return;area.innerHTML=`<div class="cameraBox"><video id="qrVideo" playsinline muted></video></div><div id="scanResult" class="scanResult">카메라 권한을 허용해주세요. QR이 인식되면 자동으로 입장 처리됩니다.</div><div class="btnrow"><button class="btn light full" onclick="stopScanner()">카메라 끄기</button></div><canvas id="qrCanvas" style="display:none"></canvas>`;try{st.scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});const video=document.getElementById("qrVideo");video.srcObject=st.scanStream;await video.play();scanLoop()}catch(err){console.error(err);document.getElementById("scanResult").textContent="카메라를 실행할 수 없습니다. 브라우저 권한과 HTTPS 환경을 확인해주세요."}}
async function scanLoop(){const video=document.getElementById("qrVideo"),canvas=document.getElementById("qrCanvas"),result=document.getElementById("scanResult");if(!video||!canvas||!st.scanStream)return;const ctx=canvas.getContext("2d");if(video.readyState===video.HAVE_ENOUGH_DATA){canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.drawImage(video,0,0,canvas.width,canvas.height);const img=ctx.getImageData(0,0,canvas.width,canvas.height);const found=jsQR(img.data,canvas.width,canvas.height);if(found&&found.data){const msg=await checkinByCode(found.data);if(result)result.textContent=msg;stopScanner(false);toast(msg);return}}st.scanTimer=requestAnimationFrame(scanLoop)}
function stopScanner(clear=true){if(st.scanTimer){cancelAnimationFrame(st.scanTimer);st.scanTimer=null}if(st.scanStream){st.scanStream.getTracks().forEach(t=>t.stop());st.scanStream=null}if(clear){const area=document.getElementById("scannerArea");if(area)area.innerHTML=""}}
function resetLocal(){if(!confirm("로컬 데모 데이터를 초기화할까요?"))return;localStorage.removeItem("sg_real_reservations");localStorage.removeItem("sg_real_notices");localStorage.removeItem("sg_real_penalties");localStorage.removeItem("sg_real_queueControls");localStorage.removeItem("sg_real_seeded");st.reservations=[];st.notices=[];st.penalties={};st.queueControls={};seedLocalIfNeeded();render();toast("로컬 데이터가 초기화되었습니다.")}
function seedLocalIfNeeded(){if(localStorage.getItem("sg_real_seeded"))return;const today=fmt(new Date());st.notices=[{id:"n1",type:"공지",title:"시범 운영 안내",body:"서구밥상 시범 운영 중입니다. 예약 시간 분산에 협조해주시기 바랍니다.",createdAtMs:Date.now()},{id:"n2",type:"업데이트",title:"QR 체크인 준비",body:"관리자 화면에서 QR 카메라 인식 기능을 점검할 수 있습니다.",createdAtMs:Date.now()-1000}];saveLocal();localStorage.setItem("sg_real_seeded","1")}
</script>
