<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="서구청 직원이 만든 생활 도구 4곳 — 서구밥상, 시민참여단 통합어플, 함께가정, 우리 동네 비상벨 찾기">
<meta property="og:title" content="서구 아일랜드">
<meta property="og:description" content="해온이와 함께 둘러보는 서구 생활 도구 4곳. 눌러서 바로 쓰고, 휴대폰에 설치하세요.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#9fd8f2">
<title>서구 아일랜드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D island; title top-left, view toggle top-right, project card as bottom sheet (phone) / right panel (desktop). Single daytime world. */
:root{
  --sky-top:#9fd8f2; --sky-bottom:#e9f7fb; --ink:#23303b; --muted:#5f6f7c; --paper:rgba(255,255,255,.92); --paper-solid:#fffdf9;
  --line:rgba(35,48,59,.12); --orange:#ff7a21; --orange-deep:#d9590a; --sea:#3aa7c9;
  --c1:#ff7a21; --c2:#2f9e6e; --c3:#e0628a; --c4:#d23b3b;
  --display:"Jua","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:linear-gradient(var(--sky-top),var(--sky-bottom));color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage.dragging{cursor:grabbing}
#stage canvas{display:block}
button{font-family:var(--body);color:var(--ink)}
button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

.top{position:fixed;z-index:8;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.top>*{pointer-events:auto}
.brand{padding:12px 16px 12px 14px;border-radius:20px;background:var(--paper);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 26px rgba(20,60,80,.14);display:flex;gap:10px;align-items:center;max-width:calc(100vw - 150px)}
.brand img{width:40px;height:auto;flex:0 0 auto}
.brand h1{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1;margin:0}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.tbtn{border:0;border-radius:999px;padding:11px 15px;background:var(--paper);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 26px rgba(20,60,80,.14);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}

.pin{position:fixed;z-index:3;left:0;top:0;transform:translate(-50%,-100%);display:flex;align-items:center;gap:7px;padding:6px 12px 6px 6px;border:0;border-radius:999px;background:#fff;box-shadow:0 6px 18px rgba(20,60,80,.2);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:opacity .2s}
.pin i{display:grid;place-items:center;width:24px;height:24px;border-radius:999px;color:#fff;font-style:normal;font-family:var(--display);font-size:14px}
.pin::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:2px;z-index:-1}
.pin.dim{opacity:.35}.pin.hidden{opacity:0;pointer-events:none}

.hint{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);padding:8px 14px;border-radius:999px;background:rgba(35,48,59,.72);color:#fff;font-size:12px;white-space:nowrap;pointer-events:none;transition:opacity .4s}
.credit{position:fixed;z-index:4;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);font-size:11px;letter-spacing:.04em;color:rgba(35,48,59,.45);pointer-events:none}

.card{position:fixed;z-index:6;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-height:62vh;overflow:auto;padding:18px 18px 16px;border-radius:26px;background:var(--paper-solid);box-shadow:0 18px 50px rgba(20,60,80,.28);transform:translateY(calc(100% + 30px));transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.card.open{transform:none}
.card-head{display:flex;gap:14px;align-items:flex-start}
.card-head img{width:64px;height:auto;flex:0 0 auto;margin-top:-4px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--accent,var(--orange))}
.card h2{word-break:keep-all;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.15;margin:2px 0 4px;text-wrap:balance}
.card .one{word-break:keep-all;margin:0;font-size:14px;line-height:1.55;color:var(--muted)}
.x{margin-left:auto;flex:0 0 auto;width:36px;height:36px;border:0;border-radius:999px;background:#f1f3f4;font-size:18px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 12px}
.chips span{padding:6px 11px;border-radius:999px;background:color-mix(in srgb,var(--accent,#ff7a21) 12%,#fff);color:color-mix(in srgb,var(--accent,#ff7a21) 80%,#222);font-size:12px;font-weight:700}
.shot{display:grid;place-items:center;aspect-ratio:16/9;max-width:100%;border-radius:18px;border:2px dashed color-mix(in srgb,var(--accent,#ff7a21) 45%,#fff);background:color-mix(in srgb,var(--accent,#ff7a21) 6%,#fff);color:var(--muted);font-size:13px;text-align:center;line-height:1.5}
.todo{display:inline-block;margin-left:4px;padding:1px 6px;border-radius:6px;background:#fff3c4;color:#8a6100;font-size:10px;font-weight:700;vertical-align:2px}
.actions{display:flex;gap:8px;margin-top:14px}
.go{flex:1;display:flex;justify-content:center;align-items:center;gap:6px;padding:14px;border-radius:16px;background:var(--accent,var(--orange));color:#fff;text-decoration:none;font-weight:700;font-size:15px}
.go.off{background:#e3e7ea;color:#7b8790;pointer-events:none}
.nav{flex:0 0 auto;width:52px;border:1px solid var(--line);border-radius:16px;background:#fff;font-size:18px;cursor:pointer}

.list{position:fixed;z-index:7;inset:0;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 76px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);background:linear-gradient(var(--sky-top),var(--sky-bottom))}
.list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;max-width:960px;margin:0 auto}
.lcard{display:flex;gap:12px;align-items:center;padding:16px;border:0;border-radius:22px;background:#fff;box-shadow:0 8px 24px rgba(20,60,80,.12);text-align:left;cursor:pointer;min-width:0}
.lcard i{flex:0 0 auto;display:grid;place-items:center;width:44px;height:44px;border-radius:14px;color:#fff;font-style:normal;font-family:var(--display);font-size:22px}
.lcard b{display:block;font-size:16px}.lcard small{display:block;margin-top:2px;font-size:12px;color:var(--muted);line-height:1.45}
.lcard div{min-width:0}

.loading{position:fixed;z-index:9;inset:0;display:grid;place-items:center;background:linear-gradient(var(--sky-top),var(--sky-bottom));transition:opacity .5s}
.loading img{width:110px;animation:bob 1.2s ease-in-out infinite}
.loading.gone{opacity:0;pointer-events:none}
@keyframes bob{50%{transform:translateY(-8px)}}

.news-mode .chips,.news-mode .sub-actions,.news-mode .qr-wrap{display:none!important}
.news-mode .shot{display:flex!important;flex-direction:column;gap:8px;aspect-ratio:auto;border:0;background:none;place-items:stretch}
.news{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:#f3f6f9;color:var(--ink);text-decoration:none;text-align:left}
.news i{flex:0 0 auto;display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:#1f3a5f;color:#fff;font-style:normal;font-family:var(--display)}
.news span{flex:1;min-width:0}.news b{display:block;font-size:14px;line-height:1.4;word-break:keep-all}.news small{display:block;margin-top:3px;font-size:12px;color:var(--muted)}.news em{font-style:normal;color:var(--muted)}
.news-empty{padding:16px;color:var(--muted);font-size:13px}
.who{display:block;margin-top:4px;font-size:12px;font-weight:700;color:var(--accent,var(--orange))}
.sub-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.sub-actions button{padding:12px 6px;border-radius:14px;border:1.5px solid color-mix(in srgb,var(--accent,#ff7a21) 35%,#fff);background:#fff;font-size:13px;font-weight:700;cursor:pointer}
.qr-wrap{display:none;align-items:center;gap:12px;margin-top:12px;padding:10px;border-radius:16px;background:#f6f8f9}
.qr-wrap span{font-size:12px;color:var(--muted);line-height:1.5}.qr-wrap #cQr{flex:0 0 auto;padding:6px;background:#fff;border-radius:10px;line-height:0}
.guide{position:fixed;z-index:10;inset:0;display:grid;place-items:end center;padding:12px;background:rgba(20,40,55,.4)}
.gsheet{width:min(440px,100%);padding:20px;border-radius:26px;background:var(--paper-solid);box-shadow:0 18px 50px rgba(20,60,80,.3);margin-bottom:env(safe-area-inset-bottom,0px)}
.ghead{display:flex;align-items:flex-start;gap:10px}.ghead h3{word-break:keep-all;margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:24px}
.gdev{font-size:12px;font-weight:700;color:var(--muted)}
.gwarn{margin-top:12px;padding:10px 12px;border-radius:12px;background:#fff6dc;color:#7a5600;font-size:13px;line-height:1.5}
.gsteps{list-style:none;margin:14px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.gsteps li{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:#f6f8f9}
.gsteps i{flex:0 0 auto;display:grid;place-items:center;width:30px;height:30px;border-radius:999px;background:var(--ink);color:#fff;font-style:normal;font-family:var(--display);font-size:16px}
.gsteps b{display:block;font-size:15px}.gsteps small{display:block;margin-top:2px;font-size:12px;color:var(--muted)}
.gsheet .go{display:flex}
.toast{position:fixed;z-index:11;left:50%;top:calc(env(safe-area-inset-top,0px) + 86px);transform:translateX(-50%);max-width:calc(100vw - 32px);padding:10px 16px;border-radius:999px;background:rgba(35,48,59,.88);color:#fff;font-size:13px;word-break:break-all;text-align:center}
@media (min-width:760px){.qr-wrap{display:flex}.guide{place-items:center}}
@media (max-width:759px){.card h2{font-size:22px}.card-head img{width:54px}.shot{display:none}.card{padding:16px 16px 14px}.chips{margin:10px 0 0}}
@media (min-width:760px){
  .card{left:auto;right:20px;top:calc(env(safe-area-inset-top,0px) + 90px);bottom:20px;width:380px;max-height:none;transform:translateX(calc(100% + 40px))}
  .card.open{transform:none}
}
/* 걷기 모드: 들어가기 버튼, 조이스틱, 말 걸기, 대화창 */
.enter{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 58px);border:0;border-radius:999px;padding:14px 22px;background:var(--orange);color:#fff;font-size:15px;font-weight:700;box-shadow:0 10px 28px rgba(217,89,10,.35);cursor:pointer;white-space:nowrap}
.stick{position:fixed;z-index:5;left:calc(env(safe-area-inset-left,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.32);border:2px solid rgba(255,255,255,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:none}
.stick i{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(20,60,80,.25);pointer-events:none}
.talk-btn{position:fixed;z-index:5;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 48px);border:0;border-radius:999px;padding:16px 22px;background:var(--orange);color:#fff;font-size:16px;font-weight:700;box-shadow:0 10px 28px rgba(217,89,10,.35);cursor:pointer;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.7);opacity:0}}
body.walking .pin{pointer-events:none}
body.walking .credit{display:none}
body.walking .brand p{display:none}
body.walking .brand{padding:9px 14px 9px 10px}
body.walking .brand img{width:32px}
body.walking .brand h1{font-size:18px}
.brand h1{white-space:nowrap}
body.walking .hint{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 74px);white-space:normal;text-align:center;max-width:calc(100vw - 40px)}
.talk{position:fixed;z-index:9;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:520px;margin:0 auto;padding:16px;border-radius:26px;background:var(--paper-solid);box-shadow:0 18px 50px rgba(20,60,80,.3);animation:pop .25s ease-out}
.thead{display:flex;gap:10px;align-items:center}.thead img{width:52px;height:auto;flex:0 0 auto}
.thead b{display:block;font-family:var(--display);font-weight:400;font-size:20px;line-height:1.1}.thead small{display:block;margin-top:2px;font-size:12px;font-weight:700;color:var(--accent,var(--orange))}
.thead .x{margin-left:auto}
.tmsg{margin:12px 2px 14px;font-size:15px;line-height:1.65;word-break:keep-all;min-height:3.3em}
.topts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.topts button,.topts a{display:flex;align-items:center;justify-content:center;min-height:46px;padding:10px 12px;border-radius:14px;border:1.5px solid color-mix(in srgb,var(--accent,#ff7a21) 30%,#fff);background:#fff;color:var(--ink);font-size:14px;font-weight:700;text-decoration:none;text-align:center;word-break:keep-all;cursor:pointer}
.topts .main{background:var(--accent,var(--orange));border-color:transparent;color:#fff}
.topts .wide{grid-column:1/-1;justify-content:flex-start;text-align:left}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="stage"></div>
<div class="loading" id="loading"><img alt="" id="loadImg"></div>

<div class="top">
  <div class="brand"><img alt="" id="brandImg"><div><h1>서구 아일랜드</h1><p>직원이 만든 생활 도구 4곳</p></div></div>
  <button class="tbtn" id="viewBtn" type="button">목록으로 보기</button>
</div>

<div id="pins"></div>
<div class="hint" id="hint">섬을 끌어서 돌려보고, 이름표를 눌러보세요</div>
<div class="credit">made by jiseung</div>

<section class="card" id="card" aria-live="polite" aria-hidden="true">
  <div class="card-head">
    <img alt="" id="cImg">
    <div style="min-width:0">
      <div class="eyebrow" id="cEye"></div>
      <h2 id="cTitle"></h2>
      <p class="one" id="cOne"></p>
    </div>
    <button class="x" id="cClose" type="button" aria-label="닫고 섬 전체 보기">×</button>
  </div>
  <div class="chips" id="cChips"></div>
  <div class="shot" id="cShot"></div>
  <div class="actions">
    <button class="nav" id="cPrev" type="button" aria-label="이전 프로젝트">‹</button>
    <a class="go" id="cGo" target="_blank" rel="noopener"></a>
    <button class="nav" id="cNext" type="button" aria-label="다음 프로젝트">›</button>
  </div>
  <div class="sub-actions"><button type="button" id="cInstall">📲 휴대폰에 설치</button><button type="button" id="cCopy">🔗 링크 복사</button></div>
  <div class="qr-wrap" id="cQrWrap"><div id="cQr"></div><span>PC에서 보고 있다면<br>휴대폰 카메라로 찍어 바로 열기</span></div>
</section>

<div class="guide" id="guide" hidden><div class="gsheet" role="dialog" aria-labelledby="gTitle">
  <div class="ghead"><div><span class="gdev" id="gDevice"></span><h3 id="gTitle"></h3></div><button class="x" id="gClose" type="button" aria-label="닫기">×</button></div>
  <div class="gwarn" id="gWarn" hidden>카톡 같은 앱 안에서 열었다면, 먼저 오른쪽 위 메뉴에서 <b>다른 브라우저로 열기</b>를 눌러주세요.</div>
  <ol class="gsteps" id="gSteps"></ol>
  <a class="go" id="gOpen" target="_blank" rel="noopener">바로 열기 ↗</a>
</div></div>
<button class="enter" id="enterBtn" type="button">🚶 섬에 들어가 걷기</button>
<div id="walkUi" hidden>
  <div class="stick" id="stick" aria-label="걷기 조이스틱"><i id="knob"></i></div>
  <button class="talk-btn" id="talkBtn" type="button" hidden>💬 말 걸기</button>
</div>
<div class="talk" id="talk" role="dialog" aria-labelledby="tName" hidden>
  <div class="thead"><img alt="" id="tImg"><div><b id="tName"></b><small id="tRole"></small></div><button class="x" id="tClose" type="button" aria-label="대화 닫기">×</button></div>
  <p class="tmsg" id="tMsg" aria-live="polite"></p>
  <div class="topts" id="tOpts"></div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="list" id="list" hidden><div class="list-grid" id="listGrid"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    :[["크롬·삼성인터넷으로 열기","아래 '바로 열기'를 눌러 열어요"],["⋮ 메뉴 누르기","오른쪽 위 점 세 개(삼성인터넷은 아래 ≡)"],["'앱 설치' 또는 '홈 화면에 추가'","누르면 앱 아이콘이 생겨요"]];
  $("gTitle").textContent=`${p.name} 설치하기`;
  $("gDevice").textContent=isIOS?"아이폰 · 아이패드":"갤럭시 · 안드로이드";
  $("gWarn").hidden=!inApp;
  $("gSteps").innerHTML=steps.map((s,k)=>`<li><i>${k+1}</i><div><b>${s[0]}</b><small>${s[1]}</small></div></li>`).join("");
  $("gOpen").href=p.url;$("guide").style.setProperty("--accent",p.color);$("guide").hidden=false;
}

  catch(e){const t=document.createElement("textarea");t.value=p.url;document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand("copy")}catch(_){}t.remove();toast(ok?"링크를 복사했어요":p.url);}

$("guide").onclick=e=>{if(e.target.id==="guide")$("guide").hidden=true;};

  const z=i===4?HALL:ZONES[i],wide=innerWidth>=760,narrow=innerWidth/innerHeight<0.8,card=$("card");

  Object.assign(goal,{tx:z.x*0.92,ty:2.2,tz:z.z*0.92,dist:narrow?34:30,az:Math.atan2(z.x,z.z),el:0.72,ox,oy});
  ZONES.forEach((zz,k)=>zz.ring.material.opacity=k===i?0.9:0);if(i===4)Object.assign(goal,{tx:0,ty:3.4,tz:0,az:0.15,el:0.32,dist:innerWidth/innerHeight<0.8?30:22});

function closeCard(){focus=-1;$("enterBtn").hidden=walking;$("card").classList.remove("open");$("card").setAttribute("aria-hidden","true");Object.assign(goal,OVER,{az:rig.az,dist:fitDist()});ZONES.forEach(z=>z.ring.material.opacity=0);startTween();}

$("cPrev").onclick=()=>openZone((focus+4)%5);$("cNext").onclick=()=>openZone((focus+1)%5);

/* ---------- list view ---------- */
$("listGrid").innerHTML=PROJECTS.map((p,i)=>`<button class="lcard" type="button" data-i="${i}"><i style="background:${p.color}">${i+1}</i><div><b>${p.name}</b><small>${p.one}</small></div></button>`).join("");
$("listGrid").onclick=e=>{const b=e.target.closest(".lcard");if(!b)return;toggleList(false);openZone(+b.dataset.i);};

/* ---------- 걷기 모드 ---------- */
let walking=false,talkNpc=-1,nearNpc=-1,typeT=0;
const touchUI=matchMedia("(pointer:coarse)").matches||navigator.maxTouchPoints>0;
const WC={yaw:0,pitch:.34,dist:6.5,pos:new THREE.Vector3(),look:new THREE.Vector3(),fast:0},camGoal=new THREE.Vector3(),camLook=new THREE.Vector3(),camDir=new THREE.Vector3();
const keys={},stick={x:0,y:0};
let hintT=0;function showHint(text,ms){const h=$("hint");h.textContent=text;h.style.opacity=1;clearTimeout(hintT);hintT=setTimeout(()=>h.style.opacity=0,ms||5000);}
function enterWalk(){
  if(walking)return;if(focus>=0)closeCard();if(!$("list").hidden)toggleList(false);
  walking=true;document.body.classList.add("walking");if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  WC.pos.copy(camera.position);WC.look.set(rig.tx,rig.ty,rig.tz);WC.yaw=player.yaw+Math.PI;WC.pitch=.34;WC.fast=0;camera.clearViewOffset();
  $("viewBtn").textContent="↩ 하늘에서 보기";$("enterBtn").hidden=true;$("walkUi").hidden=false;$("stick").hidden=!touchUI;nearNpc=-1;
  if(!touchUI)lockMouse();
  showHint(touchUI?"왼쪽 동그라미로 걷고, 화면을 끌어 둘러보세요":"마우스로 둘러보고 WASD로 걸어요 · Esc를 누르면 커서가 나와요",6000);requestRender();
}
function exitWalk(){
  if(!walking)return;unlockMouse();closeTalk();walking=false;document.body.classList.remove("walking");
  const d=camera.position.clone().sub(WC.look),L=d.length()||1;
  Object.assign(rig,{tx:WC.look.x,ty:WC.look.y,tz:WC.look.z,dist:L,az:Math.atan2(d.x,d.z),el:Math.asin(clamp(d.y/L,-1,1)),ox:0,oy:0});
  Object.assign(goal,OVER,{az:rig.az,dist:fitDist()});
  P.vx=P.vz=0;player.v=0;for(const k in keys)keys[k]=false;resetStick();
  $("viewBtn").textContent="목록으로 보기";$("walkUi").hidden=true;$("talkBtn").hidden=true;$("enterBtn").hidden=false;startTween();
}
$("enterBtn").onclick=enterWalk;
function updatePlayer(dt){
  let ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+stick.x,iy=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)+stick.y;
  if(talkNpc>=0||!$("guide").hidden)ix=iy=0;
  const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m;}
  const sy=Math.sin(WC.yaw),cy=Math.cos(WC.yaw),mx=-sy*iy+cy*ix,mz=-cy*iy-sy*ix,SPEED=3.6,k=Math.min(1,dt*10);
  P.vx+=(mx*SPEED-P.vx)*k;P.vz+=(mz*SPEED-P.vz)*k;
  const q={x:P.x+P.vx*dt,z:P.z+P.vz*dt};collide(q,.4);
  [...NPCS.map(n=>n.h),...walkers.map(w=>w.h)].forEach(h=>{const o=h.root.position,dx=q.x-o.x,dz=q.z-o.z,d=Math.hypot(dx,dz);if(d<.75&&d>1e-4){q.x=o.x+dx/d*.75;q.z=o.z+dz/d*.75;}});
  P.vx=(q.x-P.x)/dt;P.vz=(q.z-P.z)/dt;P.x=q.x;P.z=q.z;
  player.root.position.set(P.x,groundAt(P.x,P.z),P.z);player.v=Math.hypot(P.vx,P.vz);
  if(m>.08)player.yaw=angLerp(player.yaw,Math.atan2(mx,mz),Math.min(1,dt*12));player.root.rotation.y=player.yaw;
  // 가장 가까운 안내 해온이
  let best=-1,bd=2.6;NPCS.forEach(n=>{const d=Math.hypot(P.x-n.x,P.z-n.z);if(d<bd){bd=d;best=n.i;}});
  if(best!==nearNpc){nearNpc=best;if(best>=0&&talkNpc<0)NPCS[best].h.wave=1.3;}
  $("talkBtn").hidden=nearNpc<0||talkNpc>=0;
}
function updateWalkCam(dt){
  WC.fast=Math.min(1,WC.fast+dt*.7);
  camLook.set(P.x,player.root.position.y+1.15,P.z);
  const cp=Math.cos(WC.pitch);camDir.set(Math.sin(WC.yaw)*cp,Math.sin(WC.pitch),Math.cos(WC.yaw)*cp);
  let d=WC.dist;for(let s=.8;s<=WC.dist;s+=.3){if(camBlocked(camLook.x+camDir.x*s,camLook.y+camDir.y*s,camLook.z+camDir.z*s)){d=Math.max(1.4,s-.4);break;}}
  const k=1-Math.exp(-dt*(1.6+WC.fast*8)*(mouseLocked()?2.5:1));
  WC.pos.lerp(camGoal.copy(camLook).addScaledVector(camDir,d),k);WC.look.lerp(camLook,k);
  camera.position.copy(WC.pos);camera.lookAt(WC.look);
}
function updateNpcs(dt,s){NPCS.forEach(n=>{const h=n.h,d=Math.hypot(P.x-n.x,P.z-n.z),g=walking&&d<4.5?Math.atan2(P.x-n.x,P.z-n.z):h.home;
  h.yaw=angLerp(h.yaw,g,Math.min(1,dt*5));h.root.rotation.y=h.yaw;h.bubble.visible=walking&&talkNpc!==n.i;h.bubble.position.y=1.95+Math.sin(s*3+n.i)*.05;});}

/* ---------- 대화 ---------- */

    if(step==="news"){const items=(NEWS.items||[]).slice(0,2);
      return {msg:items.length?"오늘 여러 언론이 많이 다룬 서구 소식이에요. 구청 현수막에도 걸어뒀어요!":"오늘 소식을 아직 못 가져왔어요. 조금 뒤에 다시 물어봐 주세요.",
        opts:[...items.map((n,k)=>({href:n.url,l:`${k+1}. ${n.short||n.title} ↗`,cls:"wide"})),...ask,bye]};}

      opts:[...ask,{href:"https://www.seogu.gwangju.kr/",l:"서구청 누리집 ↗"},bye]};
  }
  const p=PROJECTS[i],ask=[{k:"what",l:"이건 뭐예요?"},{k:"who",l:"누가 쓰나요?"},{k:"install",l:"폰에 어떻게 깔아요?"}].filter(o=>o.k!==step);
  if(step==="install")return {msg:"먼저 '바로 열기'로 연 다음, 홈 화면에 추가하면 앱처럼 쓸 수 있어요. 아래 버튼을 누르면 쓰고 계신 폰에 맞게 알려드릴게요.",opts:[{k:"guide",l:"📲 내 폰 설치 방법",cls:"main"},...ask,bye]};

function openTalk(i){
  unlockMouse();
  talkNpc=i;const n=NPCS[i];n.h.wave=1.3;P.vx=P.vz=0;player.yaw=Math.atan2(n.x-P.x,n.z-P.z);player.root.rotation.y=player.yaw;
  $("talk").style.setProperty("--accent",n.color);$("tImg").src=HAEON[i<4?PROJECTS[i].pose:"wave"];$("tName").textContent=n.name;$("tRole").textContent=i<4?PROJECTS[i].name:"광주 서구청";

}
function closeTalk(){clearInterval(typeT);talkNpc=-1;$("talk").hidden=true;if(walking){$("walkUi").hidden=false;resetStick();}}
function talkTo(step){
  const r=talkContent(talkNpc,step);
  $("tOpts").innerHTML=r.opts.map(o=>o.href?`<a href="${o.href}" target="_blank" rel="noopener" class="${o.cls||""}">${esc(o.l)}</a>`:`<button type="button" data-k="${o.k}" class="${o.cls||""}">${esc(o.l)}</button>`).join("");

function esc(v){return String(v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

$("tOpts").onclick=e=>{const b=e.target.closest("button");if(!b)return;const k=b.dataset.k;if(k==="bye")return closeTalk();if(k==="guide")return installGuide(talkNpc);talkTo(k);};
$("tClose").onclick=closeTalk;
$("talkBtn").onclick=()=>{if(nearNpc>=0)openTalk(nearNpc);};

/* ---------- PC: FPS처럼 마우스로 둘러보기(클릭하면 커서가 숨고, Esc로 다시 나옴) ---------- */
function mouseLocked(){return document.pointerLockElement===renderer.domElement;}
function lockMouse(){const c=renderer.domElement;if(touchUI||mouseLocked()||!c.requestPointerLock)return;try{const r=c.requestPointerLock();if(r&&r.catch)r.catch(()=>{});}catch(_){}}
function unlockMouse(){if(mouseLocked()&&document.exitPointerLock)document.exitPointerLock();}
document.addEventListener("mousemove",e=>{if(!walking||!mouseLocked())return;WC.yaw-=e.movementX*.0025;WC.pitch=clamp(WC.pitch+e.movementY*.002,.06,1.1);});
document.addEventListener("pointerlockchange",()=>{if(walking&&!mouseLocked()&&talkNpc<0&&$("guide").hidden)showHint("화면을 클릭하면 다시 마우스로 둘러봐요",3000);});

/* ---------- 조이스틱 ---------- */
const stickEl=$("stick"),knob=$("knob");let stickId=null;
function resetStick(){stickId=null;stick.x=stick.y=0;knob.style.transform="";}
function moveStick(e){const r=stickEl.getBoundingClientRect(),R=r.width/2-12;let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const d=Math.hypot(dx,dy);if(d>R){dx*=R/d;dy*=R/d;}knob.style.transform=`translate(${dx}px,${dy}px)`;stick.x=dx/R;stick.y=-dy/R;}
stickEl.addEventListener("pointerdown",e=>{e.preventDefault();stickId=e.pointerId;try{stickEl.setPointerCapture(e.pointerId)}catch(_){}moveStick(e);$("hint").style.opacity=0;});
stickEl.addEventListener("pointermove",e=>{if(e.pointerId===stickId)moveStick(e);});
["pointerup","pointercancel","lostpointercapture"].forEach(t=>stickEl.addEventListener(t,e=>{if(e.pointerId===stickId)resetStick();}));

/* ---------- input: drag to orbit (or look around while walking), pinch/wheel to zoom, tap to pick ---------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
let down=null,pointers=new Map(),pinch0=0;
const cv=renderer.domElement;
cv.addEventListener("pointerdown",e=>{if(walking&&mouseLocked()){if(nearNpc>=0&&talkNpc<0)openTalk(nearNpc);return;}try{cv.setPointerCapture(e.pointerId)}catch(_){}pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1)down={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,az:goal.az,el:goal.el,t:performance.now()};
  if(pointers.size===2){const [a,b]=[...pointers.values()],span=Math.hypot(a.x-b.x,a.y-b.y)||1;pinch0=span*(walking?WC.dist:goal.dist);}});
cv.addEventListener("pointermove",e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){const [a,b]=[...pointers.values()],span=Math.hypot(a.x-b.x,a.y-b.y)||1;if(walking)WC.dist=clamp(pinch0/span,3.5,12);else{goal.dist=clamp(pinch0/span,18,95);startTween(true);}return;}
  if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.hypot(dx,dy)>4){dragging=true;$("stage").classList.add("dragging");$("hint").style.opacity=0;}
  if(!dragging)return;
  if(walking){WC.yaw-=(e.clientX-down.lx)*.008;WC.pitch=clamp(WC.pitch+(e.clientY-down.ly)*.005,.06,1.1);down.lx=e.clientX;down.ly=e.clientY;}
  else{goal.az=down.az-dx*0.006;goal.el=clamp(down.el+dy*0.004,0.22,1.25);startTween(true);}});
function up(e){pointers.delete(e.pointerId);$("stage").classList.remove("dragging");if(down&&!dragging&&performance.now()-down.t<400&&!pick(e.clientX,e.clientY)&&walking&&e.pointerType==="mouse"&&talkNpc<0)lockMouse();if(pointers.size===0){down=null;dragging=false;}}
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
cv.addEventListener("wheel",e=>{e.preventDefault();if(walking){WC.dist=clamp(WC.dist*(1+Math.sign(e.deltaY)*0.1),3.5,12);return;}goal.dist=clamp(goal.dist*(1+Math.sign(e.deltaY)*0.08),18,95);startTween(true);},{passive:false});
function pick(x,y){
  ndc.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
  if(walking){if(talkNpc>=0)return true;const hit=ray.intersectObjects([...NPCS.map(n=>n.h.root),hall],true)[0];if(!hit)return false;
    if(hit.object.userData.news!==undefined){openNews(hit.object.userData.news);return true;}
    let o=hit.object;while(o&&o.userData.npc===undefined)o=o.parent;if(!o)return false;
    const n=NPCS[o.userData.npc];if(Math.hypot(P.x-n.x,P.z-n.z)<4)openTalk(n.i);else toast(`${n.name}에게 조금 더 가까이 가 보세요`);return true;}
  const hit=ray.intersectObjects([...ZONES.map(z=>z.group),hall],true)[0];
  if(hit&&hit.object.userData.news!==undefined){openNews(hit.object.userData.news);return true;}
  if(hit&&hit.object.userData.zone!==undefined)openZone(hit.object.userData.zone);else if(focus>=0)closeCard();return true;
}
function openNews(k){const n=(NEWS.items||[])[k];if(!n||!n.url)return toast("오늘 소식을 불러오는 중이에요");unlockMouse();const l=document.createElement("a");l.href=n.url;l.target="_blank";l.rel="noopener";document.body.appendChild(l);l.click();l.remove();}
const MOVE_KEYS=["KeyW","KeyA","KeyS","KeyD","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"];
addEventListener("keydown",e=>{
  if(walking){
    if(e.key==="Escape"){if(!$("guide").hidden)$("guide").hidden=true;else if(talkNpc>=0)closeTalk();return;}
    if(talkNpc>=0||/INPUT|TEXTAREA/.test(e.target.tagName))return;
    if(MOVE_KEYS.includes(e.code)){keys[e.code]=true;e.preventDefault();$("hint").style.opacity=0;}
    if((e.code==="KeyE"||e.code==="Space"||e.code==="Enter")&&nearNpc>=0){e.preventDefault();openTalk(nearNpc);}
    return;}
  if(e.key==="Escape"&&focus>=0)closeCard();if(e.key==="ArrowRight"&&focus>=0)openZone((focus+1)%5);if(e.key==="ArrowLeft"&&focus>=0)openZone((focus+4)%5);});
addEventListener("keyup",e=>{keys[e.code]=false;});
addEventListener("blur",()=>{for(const k in keys)keys[k]=false;resetStick();});
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

/* ---------- render loop: runs every frame while walking, otherwise only while something moves ---------- */
let rafId=0,lastIdle=0,idleUntil=0,lastT=0;
function requestRender(){if(!rafId)rafId=requestAnimationFrame(frame);}
function startTween(fast){tweening=true;idleUntil=performance.now()+(fast?400:1600);requestRender();}
function frame(t){
  rafId=0;const dt=Math.min(.05,lastT?(t-lastT)/1000:.016),s=t/1000;lastT=t;let moving=false;
  if(walking){updatePlayer(dt);updateWalkCam(dt);}
  else{const k=dragging||pointers.size>1?0.35:0.09;
    for(const key of ["tx","ty","tz","dist","az","el","ox","oy"]){const d=goal[key]-rig[key];if(Math.abs(d)>1e-4){rig[key]+=d*k;moving=true;}else rig[key]=goal[key];}
    placeCamera();}
  const fov=walking?55:40;if(Math.abs(camera.fov-fov)>.05){camera.fov+=(fov-camera.fov)*Math.min(1,dt*4);camera.updateProjectionMatrix();moving=true;}
  // gentle ambient life (walkers, clouds, bells, boat) — skipped for reduced motion
  if(!reduce){updateWalkers(dt);clouds.forEach(c=>{c.position.x+=0.01;if(c.position.x>60)c.position.x=-60;});boat.position.y=-0.3+Math.sin(s*1.4)*0.08;boat.rotation.z=Math.sin(s*1.1)*0.04;
    ZONES[3].group.userData.glows.forEach((h,i)=>{h.material.opacity=0.35+0.45*(0.5+0.5*Math.sin(s*3+i));});const sp=ZONES[2].group.userData.spin;if(sp)sp.rotation.y=s*0.8;foam.material.opacity=0.4+0.15*Math.sin(s*1.3);}
  updateNpcs(dt,s);animHaeon(player,dt,s);NPCS.forEach(n=>animHaeon(n.h,dt,s));walkers.forEach(w=>animHaeon(w.h,dt,s));
  renderer.render(scene,camera);updatePins();
  if(walking){requestRender();return;}
  const now=performance.now();
  if(moving||dragging||now<idleUntil){requestRender();return;}
  // idle: keep ambient motion at ~20fps, pause when hidden
  if(!reduce&&!document.hidden&&$("list").hidden){clearTimeout(lastIdle);lastIdle=setTimeout(requestRender,50);}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)requestRender();});
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);if(focus<0&&!walking){goal.dist=fitDist();}startTween();});

/* ---------- daily news for the banners ---------- */
function applyNews(){banners.forEach((m,k)=>{const old=m.material.map;m.material.map=bannerTex((NEWS.items||[])[k],k);m.material.needsUpdate=true;if(old)old.dispose();});if(focus===4)fillHallCard();requestRender();}
applyNews();
if(location.protocol.startsWith("http"))fetch("./news.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{if(d&&Array.isArray(d.items)&&d.items.length){NEWS=d;applyNews();}}).catch(()=>{});
/* ---------- intro ---------- */
rig.dist=OVER.dist*1.35;rig.az=OVER.az-0.9;rig.el=0.95;placeCamera();
const fontsReady=document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
fontsReady.then(()=>{$("loading").classList.add("gone");startTween();setTimeout(()=>{$("hint").style.opacity=0;},6000);});
requestRender();
})();
</script>
