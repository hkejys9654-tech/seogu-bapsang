<title>서구 아일랜드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D island; title top-left, view toggle top-right, project card as bottom sheet (phone) / right panel (desktop). Single daytime world. */
:root{
  --sky-top:#9fd8f2; --sky-bottom:#e9f7fb; --ink:#23303b; --muted:#5f6f7c; --paper:rgba(255,255,255,.92); --paper-solid:#fffdf9;
  --line:rgba(35,48,59,.12); --orange:#ff7a21; --orange-deep:#d9590a; --sea:#3aa7c9;
  --c1:#ff7a21; --c2:#2f9e6e; --c3:#e0628a; --c4:#d23b3b;
  --display:"Jua","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:linear-gradient(var(--sky-top),var(--sky-bottom));color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage.dragging{cursor:grabbing}
#stage canvas{display:block}
button{font-family:var(--body);color:var(--ink)}
button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

.top{position:fixed;z-index:8;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.top>*{pointer-events:auto}
.brand{padding:12px 16px 12px 14px;border-radius:20px;background:var(--paper);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 26px rgba(20,60,80,.14);display:flex;gap:10px;align-items:center;max-width:calc(100vw - 150px)}
.brand img{width:40px;height:auto;flex:0 0 auto}
.brand h1{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1;margin:0}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.tbtn{border:0;border-radius:999px;padding:11px 15px;background:var(--paper);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 26px rgba(20,60,80,.14);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}

.pin{position:fixed;z-index:3;left:0;top:0;transform:translate(-50%,-100%);display:flex;align-items:center;gap:7px;padding:6px 12px 6px 6px;border:0;border-radius:999px;background:#fff;box-shadow:0 6px 18px rgba(20,60,80,.2);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:opacity .2s}
.pin i{display:grid;place-items:center;width:24px;height:24px;border-radius:999px;color:#fff;font-style:normal;font-family:var(--display);font-size:14px}
.pin::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:2px;z-index:-1}
.pin.dim{opacity:.35}.pin.hidden{opacity:0;pointer-events:none}

.hint{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);padding:8px 14px;border-radius:999px;background:rgba(35,48,59,.72);color:#fff;font-size:12px;white-space:nowrap;pointer-events:none;transition:opacity .4s}
.credit{position:fixed;z-index:4;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);font-size:11px;letter-spacing:.04em;color:rgba(35,48,59,.45);pointer-events:none}

.card{position:fixed;z-index:6;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-height:62vh;overflow:auto;padding:18px 18px 16px;border-radius:26px;background:var(--paper-solid);box-shadow:0 18px 50px rgba(20,60,80,.28);transform:translateY(calc(100% + 30px));transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.card.open{transform:none}
.card-head{display:flex;gap:14px;align-items:flex-start}
.card-head img{width:64px;height:auto;flex:0 0 auto;margin-top:-4px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--accent,var(--orange))}
.card h2{word-break:keep-all;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.15;margin:2px 0 4px;text-wrap:balance}
.card .one{word-break:keep-all;margin:0;font-size:14px;line-height:1.55;color:var(--muted)}
.x{margin-left:auto;flex:0 0 auto;width:36px;height:36px;border:0;border-radius:999px;background:#f1f3f4;font-size:18px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 12px}
.chips span{padding:6px 11px;border-radius:999px;background:color-mix(in srgb,var(--accent,#ff7a21) 12%,#fff);color:color-mix(in srgb,var(--accent,#ff7a21) 80%,#222);font-size:12px;font-weight:700}
.shot{display:grid;place-items:center;aspect-ratio:16/9;max-width:100%;border-radius:18px;border:2px dashed color-mix(in srgb,var(--accent,#ff7a21) 45%,#fff);background:color-mix(in srgb,var(--accent,#ff7a21) 6%,#fff);color:var(--muted);font-size:13px;text-align:center;line-height:1.5}
.todo{display:inline-block;margin-left:4px;padding:1px 6px;border-radius:6px;background:#fff3c4;color:#8a6100;font-size:10px;font-weight:700;vertical-align:2px}
.actions{display:flex;gap:8px;margin-top:14px}
.go{flex:1;display:flex;justify-content:center;align-items:center;gap:6px;padding:14px;border-radius:16px;background:var(--accent,var(--orange));color:#fff;text-decoration:none;font-weight:700;font-size:15px}
.go.off{background:#e3e7ea;color:#7b8790;pointer-events:none}
.nav{flex:0 0 auto;width:52px;border:1px solid var(--line);border-radius:16px;background:#fff;font-size:18px;cursor:pointer}

.list{position:fixed;z-index:7;inset:0;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 76px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);background:linear-gradient(var(--sky-top),var(--sky-bottom))}
.list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;max-width:960px;margin:0 auto}
.lcard{display:flex;gap:12px;align-items:center;padding:16px;border:0;border-radius:22px;background:#fff;box-shadow:0 8px 24px rgba(20,60,80,.12);text-align:left;cursor:pointer;min-width:0}
.lcard i{flex:0 0 auto;display:grid;place-items:center;width:44px;height:44px;border-radius:14px;color:#fff;font-style:normal;font-family:var(--display);font-size:22px}
.lcard b{display:block;font-size:16px}.lcard small{display:block;margin-top:2px;font-size:12px;color:var(--muted);line-height:1.45}
.lcard div{min-width:0}

.loading{position:fixed;z-index:9;inset:0;display:grid;place-items:center;background:linear-gradient(var(--sky-top),var(--sky-bottom));transition:opacity .5s}
.loading img{width:110px;animation:bob 1.2s ease-in-out infinite}
.loading.gone{opacity:0;pointer-events:none}
@keyframes bob{50%{transform:translateY(-8px)}}

.news-mode .chips,.news-mode .sub-actions,.news-mode .qr-wrap{display:none!important}
.news-mode .shot{display:flex!important;flex-direction:column;gap:8px;aspect-ratio:auto;border:0;background:none;place-items:stretch}
.news{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:#f3f6f9;color:var(--ink);text-decoration:none;text-align:left}
.news i{flex:0 0 auto;display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:#1f3a5f;color:#fff;font-style:normal;font-family:var(--display)}
.news span{flex:1;min-width:0}.news b{display:block;font-size:14px;line-height:1.4;word-break:keep-all}.news small{display:block;margin-top:3px;font-size:12px;color:var(--muted)}.news em{font-style:normal;color:var(--muted)}
.news-empty{padding:16px;color:var(--muted);font-size:13px}
.who{display:block;margin-top:4px;font-size:12px;font-weight:700;color:var(--accent,var(--orange))}
.sub-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.sub-actions button{padding:12px 6px;border-radius:14px;border:1.5px solid color-mix(in srgb,var(--accent,#ff7a21) 35%,#fff);background:#fff;font-size:13px;font-weight:700;cursor:pointer}
.qr-wrap{display:none;align-items:center;gap:12px;margin-top:12px;padding:10px;border-radius:16px;background:#f6f8f9}
.qr-wrap span{font-size:12px;color:var(--muted);line-height:1.5}.qr-wrap #cQr{flex:0 0 auto;padding:6px;background:#fff;border-radius:10px;line-height:0}
.guide{position:fixed;z-index:10;inset:0;display:grid;place-items:end center;padding:12px;background:rgba(20,40,55,.4)}
.gsheet{width:min(440px,100%);padding:20px;border-radius:26px;background:var(--paper-solid);box-shadow:0 18px 50px rgba(20,60,80,.3);margin-bottom:env(safe-area-inset-bottom,0px)}
.ghead{display:flex;align-items:flex-start;gap:10px}.ghead h3{word-break:keep-all;margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:24px}
.gdev{font-size:12px;font-weight:700;color:var(--muted)}
.gwarn{margin-top:12px;padding:10px 12px;border-radius:12px;background:#fff6dc;color:#7a5600;font-size:13px;line-height:1.5}
.gsteps{list-style:none;margin:14px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.gsteps li{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:#f6f8f9}
.gsteps i{flex:0 0 auto;display:grid;place-items:center;width:30px;height:30px;border-radius:999px;background:var(--ink);color:#fff;font-style:normal;font-family:var(--display);font-size:16px}
.gsteps b{display:block;font-size:15px}.gsteps small{display:block;margin-top:2px;font-size:12px;color:var(--muted)}
.gsheet .go{display:flex}
.toast{position:fixed;z-index:11;left:50%;top:calc(env(safe-area-inset-top,0px) + 86px);transform:translateX(-50%);max-width:calc(100vw - 32px);padding:10px 16px;border-radius:999px;background:rgba(35,48,59,.88);color:#fff;font-size:13px;word-break:break-all;text-align:center}
@media (min-width:760px){.qr-wrap{display:flex}.guide{place-items:center}}
@media (max-width:759px){.card h2{font-size:22px}.card-head img{width:54px}.shot{display:none}.card{padding:16px 16px 14px}.chips{margin:10px 0 0}}
@media (min-width:760px){
  .card{left:auto;right:20px;top:calc(env(safe-area-inset-top,0px) + 90px);bottom:20px;width:380px;max-height:none;transform:translateX(calc(100% + 40px))}
  .card.open{transform:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="stage"></div>
<div class="loading" id="loading"><img alt="" id="loadImg"></div>

<div class="top">
  <div class="brand"><img alt="" id="brandImg"><div><h1>서구 아일랜드</h1><p>직원이 만든 생활 도구 4곳</p></div></div>
  <button class="tbtn" id="viewBtn" type="button">목록으로 보기</button>
</div>

<div id="pins"></div>
<div class="hint" id="hint">섬을 끌어서 돌려보고, 이름표를 눌러보세요</div>
<div class="credit">made by jiseung</div>

<section class="card" id="card" aria-live="polite" aria-hidden="true">
  <div class="card-head">
    <img alt="" id="cImg">
    <div style="min-width:0">
      <div class="eyebrow" id="cEye"></div>
      <h2 id="cTitle"></h2>
      <p class="one" id="cOne"></p>
    </div>
    <button class="x" id="cClose" type="button" aria-label="닫고 섬 전체 보기">×</button>
  </div>
  <div class="chips" id="cChips"></div>
  <div class="shot" id="cShot"></div>
  <div class="actions">
    <button class="nav" id="cPrev" type="button" aria-label="이전 프로젝트">‹</button>
    <a class="go" id="cGo" target="_blank" rel="noopener"></a>
    <button class="nav" id="cNext" type="button" aria-label="다음 프로젝트">›</button>
  </div>
  <div class="sub-actions"><button type="button" id="cInstall">📲 휴대폰에 설치</button><button type="button" id="cCopy">🔗 링크 복사</button></div>
  <div class="qr-wrap" id="cQrWrap"><div id="cQr"></div><span>PC에서 보고 있다면<br>휴대폰 카메라로 찍어 바로 열기</span></div>
</section>

<div class="guide" id="guide" hidden><div class="gsheet" role="dialog" aria-labelledby="gTitle">
  <div class="ghead"><div><span class="gdev" id="gDevice"></span><h3 id="gTitle"></h3></div><button class="x" id="gClose" type="button" aria-label="닫기">×</button></div>
  <div class="gwarn" id="gWarn" hidden>카톡 같은 앱 안에서 열었다면, 먼저 오른쪽 위 메뉴에서 <b>다른 브라우저로 열기</b>를 눌러주세요.</div>
  <ol class="gsteps" id="gSteps"></ol>
  <a class="go" id="gOpen" target="_blank" rel="noopener">바로 열기 ↗</a>
</div></div>
<div class="toast" id="toast" hidden></div>
<div class="list" id="list" hidden><div class="list-grid" id="listGrid"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const HAEON=__HAEON__;
// 내용은 나중에 채울 수 있게 한 곳에 모았습니다. todo:true 항목은 아직 채우지 않은 자리입니다.
const PROJECTS=[
  {key:"bapsang",no:"01",name:"서구밥상",color:"#ff7a21",pose:"thumbs",who:"서구청 직원",
   one:"구청 구내식당 입장 예약. 시간을 고르고 초록색으로 바뀌면 들어가요.",
   chips:["5분 단위 입장","대기번호 호출","단체 동행 링크"],url:"https://hkejys9654-tech.github.io/seogu-bapsang/"},
  {key:"citizen",no:"02",name:"시민참여단 통합어플",color:"#2f9e6e",pose:"point",who:"여성친화도시 시민참여단",
   one:"동네 안전 의견을 지도에 남기고, 함께가게도 함께 살펴요.",
   chips:["안전지도 의견 남기기","함께가게 모니터링","내 의견 모아보기"],url:"https://hkejys9654-tech.github.io/seogu-safety-map/"},
  {key:"family",no:"03",name:"함께가정 · 함께 잇다",color:"#e0628a",pose:"heart",who:"「함께 잇다」 참여 가정",
   one:"우리 가족 역할을 함께 살펴보고, 30일 동안의 변화를 사전·사후 진단으로 기록해요.",
   chips:["가정 번호로 시작","사전·사후 진단","30일 변화 기록"],url:"https://haeoni-banban-family.jimmmmay.chatgpt.site/"},
  {key:"bell",no:"04",name:"우리 동네 비상벨 찾기",color:"#d23b3b",pose:"jump",who:"서구 주민 누구나",
   one:"비상벨이 설치된 서구 공중화장실을 지도에서 찾고 바로 길찾기까지.",
   chips:["화장실·동 이름 검색","내 위치 보기","카카오맵 길찾기"],url:"https://seogu-bell-map.seogucheong086.chatgpt.site/"}
];

// 처음 열 때 쓰는 기본 기사(매일 아침 news.json 으로 바뀜)
let NEWS=__NEWS__;
(function(){
const $=id=>document.getElementById(id);
$("loadImg").src=HAEON.wave;$("brandImg").src=HAEON.wave;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- renderer ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:"low-power"});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.75));
renderer.setSize(innerWidth,innerHeight);
$("stage").appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xdff2f8,70,140);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.5,300);
scene.add(new THREE.HemisphereLight(0xffffff,0x8fb98a,0.85));
const sun=new THREE.DirectionalLight(0xfff1dc,0.75);sun.position.set(30,50,20);scene.add(sun);

const mats={};
const M=(c,o={})=>{const k=c+JSON.stringify(o);return mats[k]||(mats[k]=new THREE.MeshLambertMaterial(Object.assign({color:c,flatShading:true},o)));};
const B=new THREE.BoxGeometry(1,1,1);
function box(w,h,d,c,x,y,z,parent,ry){const m=new THREE.Mesh(B,M(c));m.scale.set(w,h,d);m.position.set(x,y,z);if(ry)m.rotation.y=ry;(parent||scene).add(m);return m;}
function roof(w,h,d,c,x,y,z,parent,ry){const g=new THREE.ConeGeometry(0.75,1,4);const m=new THREE.Mesh(g,M(c));m.rotation.y=Math.PI/4+(ry||0);m.scale.set(w,h,d);m.position.set(x,y,z);(parent||scene).add(m);return m;}
function cyl(rt,rb,h,c,x,y,z,parent,seg){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||8),M(c));m.position.set(x,y,z);(parent||scene).add(m);return m;}
function canvasTex(w,h,draw){const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=2;return t;}

/* ---------- sea & island ---------- */
const sea=new THREE.Mesh(new THREE.CircleGeometry(160,48),new THREE.MeshLambertMaterial({color:0x56b9d8}));sea.rotation.x=-Math.PI/2;sea.position.y=-0.6;scene.add(sea);
const foam=new THREE.Mesh(new THREE.RingGeometry(21.2,22.6,48),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.55}));foam.rotation.x=-Math.PI/2;foam.position.y=-0.55;scene.add(foam);
cyl(21.5,22.5,1.4,0xf1dfae,0,-0.6,0,null,28);           // sand
cyl(19.6,21,1.2,0x84c46a,0,0.05,0,null,28);             // grass
cyl(14,14.6,0.3,0x8fcc72,0,0.75,0,null,24);             // inner plateau
// paths from center to the four zones
const ZONES=[{a:Math.PI*0.25},{a:Math.PI*0.75},{a:Math.PI*1.25},{a:Math.PI*1.75}].map((z,i)=>({...z,x:Math.cos(z.a)*11.5,z:Math.sin(z.a)*11.5,p:PROJECTS[i]}));
ZONES.forEach(z=>{const len=9,mid=len/2+2;const p=box(1.8,0.12,len,0xe9dcc0,Math.cos(z.a)*mid,0.95,Math.sin(z.a)*mid);p.rotation.y=-z.a+Math.PI/2;});
cyl(3.2,3.2,0.14,0xe9dcc0,0,0.95,0,null,20);

/* ---------- center: 광주 서구청 + news banners + Haeon ---------- */
const hall=new THREE.Group();scene.add(hall);
box(7,5.2,3.4,0xf3efe6,0,3.5,-1.6,hall);box(7.4,0.4,3.8,0xc9c1b1,0,6.2,-1.6,hall);box(2.4,1.2,2.2,0xe7e1d4,0,7,-1.6,hall);
const winTex=canvasTex(256,190,(x,w,h)=>{x.fillStyle="#f3efe6";x.fillRect(0,0,w,h);for(let r=0;r<4;r++)for(let c=0;c<7;c++){x.fillStyle="#8dbad0";x.fillRect(10+c*35,10+r*44,22,28);}});
const front=new THREE.Mesh(new THREE.PlaneGeometry(7,5.2),new THREE.MeshLambertMaterial({map:winTex}));front.position.set(0,3.5,0.11);hall.add(front);
box(2,1.5,0.3,0x6f8796,0,1.7,0.2,hall);box(2.6,0.15,1,0xc9c1b1,0,2.5,0.5,hall);
const signTex=canvasTex(512,128,(x,w,h)=>{x.fillStyle="#1f3a5f";x.fillRect(0,0,w,h);x.fillStyle="#fff";x.font='bold 64px '+'"Jua","IBM Plex Sans KR",sans-serif';x.textAlign="center";x.textBaseline="middle";x.fillText("광주 서구청",w/2,h/2+4);});
const sign=new THREE.Mesh(new THREE.PlaneGeometry(2.6,0.65),new THREE.MeshBasicMaterial({map:signTex}));sign.position.set(0,2.95,0.14);hall.add(sign);
cyl(0.06,0.06,3,0x9aa3ab,3.9,6.6,-0.2,hall);box(1,0.6,0.04,0xff7a21,4.42,7.8,-0.2,hall);
// 현수막 2개: news.json 의 오늘 기사로 매일 바뀝니다
const BANNER_STYLE=[{bg:"#ffffff",fg:"#1f3a8a",tag:"#1f3a8a"},{bg:"#fff1a8",fg:"#b42318",tag:"#b42318"}];

cv.addEventListener("pointermove",e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){const [a,b]=[...pointers.values()];goal.dist=clamp(Math.hypot(a.x-b.x,a.y-b.y)/pinch0,18,95);startTween(true);return;}
  if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.hypot(dx,dy)>4){dragging=true;$("stage").classList.add("dragging");$("hint").style.opacity=0;}
  if(dragging){goal.az=down.az-dx*0.006;goal.el=clamp(down.el+dy*0.004,0.22,1.25);startTween(true);}});
function up(e){pointers.delete(e.pointerId);$("stage").classList.remove("dragging");if(down&&!dragging&&performance.now()-down.t<400)pick(e.clientX,e.clientY);if(pointers.size===0){down=null;dragging=false;}}
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
cv.addEventListener("wheel",e=>{e.preventDefault();goal.dist=clamp(goal.dist*(1+Math.sign(e.deltaY)*0.08),18,95);startTween(true);},{passive:false});
function pick(x,y){ndc.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(ndc,camera);const hit=ray.intersectObjects([...ZONES.map(z=>z.group),hall],true)[0];if(hit&&hit.object.userData.zone!==undefined)openZone(hit.object.userData.zone);else if(focus>=0)closeCard();}
addEventListener("keydown",e=>{if(e.key==="Escape"&&focus>=0)closeCard();if(e.key==="ArrowRight"&&focus>=0)openZone((focus+1)%5);if(e.key==="ArrowLeft"&&focus>=0)openZone((focus+4)%5);});
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

/* ---------- render loop: runs only while something moves ---------- */
let rafId=0,lastIdle=0,idleUntil=0;
function requestRender(){if(!rafId)rafId=requestAnimationFrame(frame);}
function startTween(fast){tweening=true;idleUntil=performance.now()+(fast?400:1600);requestRender();}
function frame(t){
  rafId=0;
  const k=dragging||pointers.size>1?0.35:0.09;let moving=false;
  for(const key of ["tx","ty","tz","dist","az","el","ox","oy"]){const d=goal[key]-rig[key];if(Math.abs(d)>1e-4){rig[key]+=d*k;moving=true;}else rig[key]=goal[key];}
  placeCamera();
  // gentle ambient life (Haeon bob, clouds, bells, boat) — skipped for reduced motion
  if(!reduce){const s=t/1000;haeon.position.y=2.7+Math.sin(s*2.2)*0.12;clouds.forEach((c,i)=>{c.position.x+=0.01;if(c.position.x>60)c.position.x=-60;});boat.position.y=-0.3+Math.sin(s*1.4)*0.08;boat.rotation.z=Math.sin(s*1.1)*0.04;
    ZONES[3].group.userData.glows.forEach((h,i)=>{h.material.opacity=0.35+0.45*(0.5+0.5*Math.sin(s*3+i));});const sp=ZONES[2].group.userData.spin;if(sp)sp.rotation.y=s*0.8;foam.material.opacity=0.4+0.15*Math.sin(s*1.3);}
  renderer.render(scene,camera);updatePins();
  const now=performance.now();
  if(moving||dragging||now<idleUntil){requestRender();return;}
  // idle: keep ambient motion at ~20fps, pause when hidden
  if(!reduce&&!document.hidden&&$("list").hidden){clearTimeout(lastIdle);lastIdle=setTimeout(requestRender,50);}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)requestRender();});
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);if(focus<0){goal.dist=fitDist();}startTween();});

/* ---------- daily news for the banners ---------- */
function applyNews(){banners.forEach((m,k)=>{const old=m.material.map;m.material.map=bannerTex((NEWS.items||[])[k],k);m.material.needsUpdate=true;if(old)old.dispose();});if(focus===4)fillHallCard();requestRender();}
applyNews();
if(location.protocol.startsWith("http"))fetch("./news.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{if(d&&Array.isArray(d.items)&&d.items.length){NEWS=d;applyNews();}}).catch(()=>{});
/* ---------- intro ---------- */
rig.dist=OVER.dist*1.35;rig.az=OVER.az-0.9;rig.el=0.95;placeCamera();
const fontsReady=document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
fontsReady.then(()=>{$("loading").classList.add("gone");startTween();setTimeout(()=>{$("hint").style.opacity=0;},6000);});
requestRender();
})();
</script>
